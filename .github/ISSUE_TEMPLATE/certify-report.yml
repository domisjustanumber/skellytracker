name: Certify report
description: Send the report of the certify suite (see CERTIFY.md).
title: "[certify] "
labels: ["certify-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running the certify suite. Read the report file before you send it.
        Do not write your name or contact details in this form.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Windows 11, Ubuntu 24.04, macOS 15 on Apple Silicon.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model
      description: For example NVIDIA RTX 3070, AMD RX 7800 XT, Apple M3.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: Attach the file `certify-report-<time>.md` here. If GitHub refuses it, rename it to `.txt`.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: A problem that you saw, if any.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read the report and it holds no personal data.
          required: true
