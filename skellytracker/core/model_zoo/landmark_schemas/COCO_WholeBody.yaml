canonical_mapping:
  body:
    nose: nose
    left_eye: left_eye
    right_eye: right_eye
    left_ear: left_ear
    right_ear: right_ear
    left_shoulder: left_shoulder
    right_shoulder: right_shoulder
    left_elbow: left_elbow
    right_elbow: right_elbow
    left_wrist: left_wrist
    right_wrist: right_wrist
    left_hip: left_hip
    right_hip: right_hip
    left_knee: left_knee
    right_knee: right_knee
    left_ankle: left_ankle
    right_ankle: right_ankle
    left_big_toe: left_big_toe
    left_small_toe: left_small_toe
    left_heel: left_heel
    right_big_toe: right_big_toe
    right_small_toe: right_small_toe
    right_heel: right_heel
    head_center: [left_ear, right_ear]
    neck_center: [left_shoulder, right_shoulder]
    trunk_center: [left_shoulder, right_shoulder, left_hip, right_hip]
    hips_center: [left_hip, right_hip]
  left_hand:
    wrist: left_hand_root
    thumb_cmc: left_thumb1
    thumb_mcp: left_thumb2
    thumb_ip: left_thumb3
    thumb_tip: left_thumb4
    index_finger_mcp: left_forefinger1
    index_finger_pip: left_forefinger2
    index_finger_dip: left_forefinger3
    index_finger_tip: left_forefinger4
    middle_finger_mcp: left_middle_finger1
    middle_finger_pip: left_middle_finger2
    middle_finger_dip: left_middle_finger3
    middle_finger_tip: left_middle_finger4
    ring_finger_mcp: left_ring_finger1
    ring_finger_pip: left_ring_finger2
    ring_finger_dip: left_ring_finger3
    ring_finger_tip: left_ring_finger4
    pinky_mcp: left_pinky_finger1
    pinky_pip: left_pinky_finger2
    pinky_dip: left_pinky_finger3
    pinky_tip: left_pinky_finger4
  right_hand:
    wrist: right_hand_root
    thumb_cmc: right_thumb1
    thumb_mcp: right_thumb2
    thumb_ip: right_thumb3
    thumb_tip: right_thumb4
    index_finger_mcp: right_forefinger1
    index_finger_pip: right_forefinger2
    index_finger_dip: right_forefinger3
    index_finger_tip: right_forefinger4
    middle_finger_mcp: right_middle_finger1
    middle_finger_pip: right_middle_finger2
    middle_finger_dip: right_middle_finger3
    middle_finger_tip: right_middle_finger4
    ring_finger_mcp: right_ring_finger1
    ring_finger_pip: right_ring_finger2
    ring_finger_dip: right_ring_finger3
    ring_finger_tip: right_ring_finger4
    pinky_mcp: right_pinky_finger1
    pinky_pip: right_pinky_finger2
    pinky_dip: right_pinky_finger3
    pinky_tip: right_pinky_finger4
