# The certification evidence of the EP packs. A person writes a row after a review (ADR-MF2R).
# The runtime never downloads this file.
# Each row has these fields. `tools/onnx_stack.py check` refuses a row with a field that is missing or not valid.
# - `ep`: the EP key, for example `trt-rtx`.
# - `os`: the OS name of the report, for example `Windows` or `Linux`.
# - `gpu`: the PCI vendor id and device id of the GPU model, in lower-case hex, for example `10de:2484`.
# - `set`: the set hash of the row, 64 lower-case hex digits. `tools/onnx_stack.py check` prints the set hash of this checkout.
# - `source`: `maintainer` or `field`.
# - `result`: `pass` or `fail`.
# - `catalog_package` (optional): the package version of the Windows ML catalog, as a string, when the EP comes from
#   that catalog. It is not in the set hash.
# A row can also have these readable versions. They are a record only. The key of a row is `ep`, `os`, `gpu` and `set`.
# No code reads these fields to match a row.
# - `pack`: the version of the EP pack.
# - `ort`: the version of the ONNX Runtime distribution, for example `1.30.0.202609102321` for `onnxruntime-windowsml`.
# - `windowsml`: the version of the `windowsml` package. Write `null` when the host has none.
# - `driver`: the GPU driver version.
# - `os_build`: the build number of the OS.
# - `os_label`: the OS as a person reads it, for example `Windows 11 Home 26H2` or `Ubuntu 24.04.1 LTS`.
schema: 1
rows:
  - {ep: trt-rtx, os: Windows, gpu: "10de:2484", set: 4abfaa7678817ed4a8ccb5f3e355ba28672589e8a3468bb6805e491dfe03a302,
     source: maintainer, result: pass, pack: 0.5.0, ort: 1.30.0.202609102321, windowsml: 2.6.74rc0, driver: "610.88", os_build: 26300,
     os_label: Windows 11 Home 26H2}
  - {ep: cuda, os: Windows, gpu: "10de:2484", set: 4abfaa7678817ed4a8ccb5f3e355ba28672589e8a3468bb6805e491dfe03a302,
     source: maintainer, result: pass, pack: 0.2.0, ort: 1.30.0.202609102321, windowsml: 2.6.74rc0, driver: "610.88", os_build: 26300,
     os_label: Windows 11 Home 26H2}
# `mediapipe`: the reviewed passes of the check `mediapipe:smoke` of `certify()` (ADR-X7WD item 11). The level `quick` runs
# that check only when no row records a pass for the MediaPipe version, the Python version and the OS of the system.
# `evidence.mediapipe_reviewed()` reads it. A person writes a row after a review of a report. Each row has these fields:
# - `version`: the version of the `mediapipe` distribution, as a string, for example `"1.2.2"`.
# - `python`: the major and the minor version of Python, as a string, for example `"3.13"`. Use quotes: YAML reads 3.10 as 3.1.
# - `os`: the OS key of the report (`evidence.os_key()`), for example `Windows 11`, `Ubuntu 24.04` or `macOS 15`.
# - `source`: `maintainer` or `field`.
# - `result`: `pass` or `fail`. Only `pass` stops the check.
# A row can also have `os_build` and `os_label`, as in `rows`. They are a record only.
mediapipe: []
# `telemetry`: the reviewed telemetry record of a library package of the ONNX stack on one OS (ADR-BZ7X). The runtime does
# not read it. `tools/onnx_stack.py` reads it: its docstring gives the rules. A person writes a row after a scan.
# - `package`, `version`: the package and its exact version. `os`: `Windows`, `Linux` or `macOS`.
# - `client`: true when a native library of the wheel holds the Microsoft 1DS telemetry client.
# - `switch_verified`: an evidence reference when a run showed that `ORT_DISABLE_TELEMETRY=1` switches the client off, else
#   false. A row with the client and `switch_verified: false` has a `reason`.
telemetry:
  - {package: onnxruntime, version: "1.30.0", os: Linux, client: true, switch_verified: false,
     reason: "the release notes of ONNX Runtime 1.29.0 document the variable; no run measured it on Linux"}
  - {package: onnxruntime-windowsml, version: "1.30.0.202609102321", os: Windows, client: false}
  - {package: onnxruntime-ep-cuda13, version: "0.2.0", os: Linux, client: true, switch_verified: false,
     reason: "the release notes of ONNX Runtime 1.29.0 document the variable; no run measured it on Linux"}
  - {package: onnxruntime-ep-cuda13, version: "0.2.0", os: Windows, client: false}
  - {package: onnxruntime-ep-nv-tensorrt-rtx-cu13, version: "0.5.0", os: Linux, client: false}
  - {package: onnxruntime-ep-nv-tensorrt-rtx-cu13, version: "0.5.0", os: Windows, client: false}
