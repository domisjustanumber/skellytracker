# The list of the check names of skellytracker: section 5.7 of the format `skellycertify.report/1.10.0`.
#
# A person writes this file. No code writes it. A new check goes into this list before its code, or in the same commit.
# The tests of `skellytracker/tests/test_certify.py` check two rules of section 5.7: each check name that a run writes
# matches an entry, and each entry is known to the code or has `built: false`. A test also checks that the table of the
# JPEG checks of `skellytracker/REASON_CODES.md` agrees with this list.
#
# The fields of an entry:
# - `name`: the check name, in its template form. `<label>` is the label of a pair (`check_label()`), for example
#   `cuda@10de-2484-0`, or `cpu` for a check of the CPU EP. `<n>` is a camera count. `<check>` is the name of an other
#   check. `<slug>` and `<name>` are the section and the check of the certify suite `tools/certify_platform.py`.
#   A JPEG check has one entry for each name of `CHECK_NAMES` of `core/decode/certification.py`.
# - `level`: `quick`, `full`, or both.
# - `rule`: the pass rule, or `record-only`.
# - `numbers`: each field of `numbers` with its unit. The units: `ms`, `s`, `MiB`, `count`, `index` (from 0),
#   `ratio`, `flag` (true or false), `pixel value` (a difference of 8-bit pixel values), `px`, `box fraction` (a part of
#   the diagonal of the person box), `word` (a fixed word), `class name` (an exception class in the form of a reason
#   code), `integer`. A value can be null when the entry says so.
#   Each check that catches an exception also writes `error` (class name) and, when the error has one, `hresult`
#   (integer: the unsigned 32-bit value on Windows), `errno` (integer) or `code` (integer: the return code of the
#   library): `error_numbers()` of `core/errors.py`. A check of a child that crashed writes `exit_code` (integer).
#   These are not repeated in each entry.
# - `details`: the fields of `details` of the report that hold the values that are the same in each row.
# - `runs_on`: the EP keys of the labels that the check runs on, or `cpu` for the CPU EP, or `mediapipe`, or `suite`.
# - `device_classes`: only for an experimental check (rule 8 of section 5.8 of the format), with `device_filter`: the
#   field of the host probe that selects the class. `DEDICATED_ONLY` of `core/decode/certification.py` holds the checks
#   of `dedicated GPU`.
# - `question` and `end`: only for a `record-only` check (rule 8 of section 5.6 of the format): the question that the
#   check answers, and what turns it into a judged check or removes it. `not stated` means that no document of this
#   repository states it yet. `source` names the text that states the question.
# - `built: false`: the check is in the list, but the code does not write it yet.

checks:
  # --- the checks of `skellytracker.certify()` -------------------------------------------------------------------
  - name: "cpu:video"
    level: [quick, full]
    rule: "pass when the CPU EP finds a person on each test frame; else fail with no-person-on-cpu"
    numbers: {cpu_ms: ms, seconds: s, failed_frame: index}
    details: [frames]
    runs_on: [cpu]
  - name: "cpu:live"
    level: [quick, full]
    rule: "pass when each box of a person and each point with a score is finite on each frame; else fail with not-finite"
    numbers: {failed_frame: index}
    runs_on: [cpu]
  - name: "<label>:probe"
    level: [quick, full]
    rule: "pass when the L3 probe of verify() passes on the GPU; else fail with probe-l2-failed or probe-l3-failed"
    numbers: {seconds: s, max_abs_diff: "absolute difference against the CPU EP"}
    runs_on: [trt-rtx, cuda, directml, coreml, amdgpu, migraphx]
  - name: "<label>:video"
    level: [quick, full]
    rule: >-
      pass when frame 0 is within each threshold of details.thresholds against frame 0 of cpu:video, each later frame
      has the same people, finite outputs and a box IoU of at least box_iou_min, and no node of the pipeline runs on
      the CPU EP; else fail with the reason of the first frame that failed, or with partial-placement
    numbers: {failed_frame: index, people_cpu: count, people_ep: count, box_iou_min: ratio, points_compared: count,
              keypoint_px_max: px, keypoint_box_fraction_max: box fraction, keypoint_box_fraction_median: box fraction,
              keypoint_box_fraction_p99: box fraction, later_keypoint_box_fraction_max: "box fraction, or null",
              ep_ms: ms, cpu_nodes: count, speed_against_cpu: "word (faster, slower or similar), level quick only", seconds: s}
    details: [thresholds, frames]
    runs_on: [trt-rtx, cuda, directml, coreml, amdgpu, migraphx]
  - name: "<label>:live"
    level: [quick, full]
    rule: "pass when each frame has finite outputs and a person; else fail with not-finite or no-person"
    numbers: {ep_ms: ms, failed_frame: index, seconds: s}
    details: [frames]
    runs_on: [trt-rtx, cuda, directml, coreml, amdgpu, migraphx]
  - name: "<label>"
    level: [quick, full]
    rule: "roll-up check: pass only when <label>:probe, <label>:video and <label>:live pass"
    numbers: {}
    runs_on: [trt-rtx, cuda, directml, coreml, amdgpu, migraphx]
  - name: "<label>:jpeg-decode"
    level: [quick]
    rule: "the pass rule of <label>:jpeg:gpu_decode.baseline_422"
    numbers: {max_abs_diff: pixel value, refused: count, seconds: s}
    details: [jpeg.limit, jpeg.buffers]
    runs_on: [cuda, trt-rtx]
  - name: "<label>:jpeg-preprocess"
    level: [quick]
    rule: "the pass rule of <label>:jpeg:preprocess_graph_ep.yolox_person"
    numbers: {max_difference: pixel value, cpu_nodes: count}
    details: [jpeg.items]
    runs_on: [cuda, trt-rtx]
  - name: "<label>:pipeline-<n>"
    level: [full]
    rule: record-only
    numbers: {start_seconds: s, first_call_ms: ms, median_ms: ms, p95_ms: ms, peak_vram_mib: "MiB, or null on the CPU EP and with no reading",
              against_cpu: "ratio, on a pair only", seconds: s}
    details: [full.camera_counts, full.warmup_calls, full.timed_calls, full.running_mode]
    runs_on: [cpu, trt-rtx, cuda, directml, coreml, amdgpu, migraphx]
    question: "How long does one call of the pipeline take at <n> cameras on this EP and GPU, and how much VRAM does it use?"
    source: "the row <ep>:pipeline-<n> of REASON_CODES.md; ADR-X7WD: \"Full is for benchmarking 1) unknown things and 2) this system\""
    end: "none: a timing has no pass rule (section 5.6 of the format)"
  - name: "<label>:jpeg"
    level: [full]
    rule: "fail when a check <label>:jpeg:<name> failed, else pass when one passed, else not-run with no-check"
    numbers: {seconds: s}
    runs_on: [cpu, cuda, trt-rtx, directml, amdgpu, migraphx]
  - name: "mediapipe:smoke"
    level: [quick]
    rule: "pass when each frame has a present row and each point that MediaPipe found has finite values; else fail with not-finite or no-person"
    numbers: {failed_frame: index, seconds: s}
    details: [frames]
    runs_on: [mediapipe]
  - name: "<check>:exit"
    level: [quick, full]
    rule: record-only
    numbers: {}
    runs_on: [cpu, trt-rtx, cuda, directml, coreml, amdgpu, migraphx, mediapipe]
    question: "Did the child of <check> end cleanly after it gave its result (section 2.5 of the format, Crashes)?"
    source: "the docstring of _add_exit() of skellytracker/certification.py"
    end: "The exit hang of the CUDA EP plugin (ADR-C6A5) has a fix or a workaround. An unclean exit then fails the check."

  # --- the checks of the JPEG certification: `<label>:jpeg:<name>` (`run_jpeg_certification()`) ----------------
  - name: "<label>:jpeg:cpu_decode.baseline_420"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.baseline_422"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.baseline_444"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.progressive"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.grayscale"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.no_dht"
    level: [full]
    rule: "pass when the CPU decode of a JPEG with no DHT segment is within jpeg.limit_mean of the source image; else fail with over_limit"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
    details: [jpeg.limit_mean]
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.rotation_0"
    level: [full]
    rule: "pass when the turned CPU decode equals the turn of the decode; else fail with mismatch"
    numbers: {height: px, width: px}
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.rotation_90"
    level: [full]
    rule: "pass when the turned CPU decode equals the turn of the decode; else fail with mismatch"
    numbers: {height: px, width: px}
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.rotation_180"
    level: [full]
