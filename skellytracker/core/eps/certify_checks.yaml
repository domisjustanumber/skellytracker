  - name: "<label>:jpeg:cpu_decode.no_soi_refused"
    level: [full]
    rule: "pass when the CPU decoder refuses a buffer with no SOI marker; else fail with not_refused"
    numbers: {}
    runs_on: [cpu]
  - name: "<label>:jpeg:cpu_decode.truncated"
    level: [full]
    rule: record-only
    numbers: {decoded: flag, max_abs_diff_to_full: pixel value}
    details: [jpeg.kept_ratio]
    runs_on: [cpu]
    question: "Does the decoder refuse a JPEG that is cut at half, or return a frame?"
    source: "the rulings of the user of 2026-11-23 (ADR-8N03)"
    end: "The pipeline spec states what a run must do with a cut JPEG. The check then passes when the decoder does that."
  - name: "<label>:jpeg:gpu_decode.baseline_420"
    level: [full]
    rule: &gpu_compare "pass when the GPU decoder decodes each buffer and the max abs difference against the CPU decode is at most jpeg.limit; else fail with refused, over_limit, mismatch or decoder_not_opened"
    numbers: &gpu_numbers {max_abs_diff: pixel value, refused: count}
    details: &gpu_details [jpeg.limit, jpeg.buffers]
    runs_on: &nvidia [cuda, trt-rtx]
  - name: "<label>:jpeg:gpu_decode.baseline_422"
    level: [full]
    rule: *gpu_compare
    numbers: *gpu_numbers
    details: *gpu_details
    runs_on: *nvidia
  - name: "<label>:jpeg:gpu_decode.baseline_444"
    level: [full]
    rule: *gpu_compare
