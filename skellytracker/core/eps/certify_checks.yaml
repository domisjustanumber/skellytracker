    level: [full]
    rule: &graph_rule "pass when the pixels of the preprocess graph are within the resize limit of the CPU resize and the tensor has the shape and the dtype of the CPU preprocess; else fail with over_limit or mismatch"
    numbers: &graph_numbers {max_difference: pixel value, cpu_nodes: count}
    details: &graph_details [jpeg.items]
    runs_on: [cpu]
  - name: "<label>:jpeg:preprocess_graph.yolox_person_mixed_sizes"
    level: [full]
    rule: *graph_rule
    numbers: *graph_numbers
    details: *graph_details
    runs_on: [cpu]
