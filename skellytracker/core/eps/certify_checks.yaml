  - name: "<label>:jpeg:cpu_decode.size_640x480"
    level: [full]
    rule: "pass when the mean abs difference of the CPU decode against the source image is at most jpeg.limit_mean; else fail with over_limit or mismatch"
    numbers: {mean_abs_diff: pixel value, max_abs_diff: pixel value}
