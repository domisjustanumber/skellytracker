# The EP catalog. It is written by hand. `tools/ep_catalog.py --check` checks it.
# `ep_lock.yaml` holds the wheels of each pack; only `tools/ep_catalog.py --refresh` writes it.
# The runtime never downloads a catalog (ADR-MF2R item 1).
schema: 1

# `version` must equal the `onnxruntime` pin of pyproject.toml and uv.lock. `windows` is the distribution
# of the same ONNX Runtime release on Windows, with its own pin.
ort_core: {package: onnxruntime, version: "1.30.0", windows: {package: onnxruntime-windowsml, version: "1.30.0.202609102321"}}

indexes:
  pypi: https://pypi.org/simple/
  # The Azure feed is the only source of the cuda plugin wheel. There is no mirror.
  ort-cuda-13: https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-13/pypi/simple/

# The platforms that have packs. macOS has no pack.
platforms: [win_amd64, manylinux_x86_64]

# A `dependency_wheels` version can be a map from a platform to a version: a platform that the map does not
# name has no such wheel. `preload_own` gives the libraries of the plugin wheel that Linux loads before the
# EP library, in order, each as the file name up to `.so`. A `driver_branch_min` can be a map from a
# platform to a branch.
# An option value is a list of the allowed strings, or `positive-int`.
# Each other option name is refused, also `device_id`: the device comes from the device map.
# `description` is one sentence for a user, at most 120 characters: what the EP runs on and what it needs.
# `status` of a pack or of a built-in EP is `ready` (the default), `test` (a test pack) or `field-test`. A
# `field-test` EP is usable only after an opt-in in the EP store, and `recommend()` never gives it (ADR-Z5X7).
# A built-in EP with `selects_gpu: true` runs on one GPU: the session takes the ONNX Runtime device of that GPU.
eps:
  trt-rtx:
    kind: plugin
    gpu: true
    display_name: NVIDIA TensorRT for RTX
    description: "Runs on NVIDIA RTX GPUs from the RTX 30 series, and needs a pack download and an NVIDIA driver R580 (Linux: R590)."
    precision_order: [fp16, fp32]
    l3_atol: 1.5e-2
    options:
      allowed: {enable_cuda_graph: ["0", "1"]}
      defaults: {}
      # build_session() sets this option to the EP cache folder. A caller cannot set it.
      cache_path_option: nv_runtime_cache_path
    packs:
      - id: trt-rtx-cu13
        package: onnxruntime-ep-nv-tensorrt-rtx-cu13
        version: "0.5.0"
        index: pypi
        ep_name: NvTensorRTRTXExecutionProvider
        library: {win_amd64: onnxruntime_providers_nv_tensorrt_rtx.dll, manylinux_x86_64: libonnxruntime_providers_nv_tensorrt_rtx.so}
        # The Linux wheel has no RUNPATH, and it holds these libraries only under their full version names.
        preload_own: [libcudart.so, libtensorrt_rtx.so, libtensorrt_onnxparser_rtx.so]
        exclusive_group: NvTensorRTRTXExecutionProvider
        # NVIDIA gives these driver floors for this pack: 580.88 on Windows and 590.48.01 on Linux.
        requires: {vendor: nvidia, cc_min: "8.0", driver_branch_min: {win_amd64: 580, manylinux_x86_64: 590}}
        ort: {vendor_tested: ["1.25", "1.30"]}
        licences:
          - {name: NVIDIA TensorRT for RTX, url: "https://pypi.org/project/onnxruntime-ep-nv-tensorrt-rtx-cu13/"}
        status: ready
  cuda:
    kind: plugin
    gpu: true
    display_name: NVIDIA CUDA
    description: "Runs on NVIDIA GPUs from the GTX 16 and RTX 20 series, and needs a pack download and an NVIDIA driver of R580 or later."
    precision_order: [fp16, fp32]
    l3_atol: 1.5e-2
    options:
      allowed: {prefer_nhwc: ["0", "1"], use_tf32: ["0", "1"], arena.max_mem: positive-int}
      # `prefer_nhwc=1` is faster for fp16 only (ADR-NZK1 item 3).
      defaults: {fp16: {prefer_nhwc: "1"}}
    packs:
      - id: cuda-cu13
        package: onnxruntime-ep-cuda13
        version: "0.2.0"
        index: ort-cuda-13
        ep_name: CUDAExecutionProvider
        library: {win_amd64: onnxruntime_providers_cuda.dll, manylinux_x86_64: libonnxruntime_providers_cuda.so}
        dependency_wheels:
          # Linux only: `libcudart.so.13`. On Windows the NVIDIA driver gives the CUDA runtime.
          - {package: nvidia-cuda-runtime, index: pypi, version: {manylinux_x86_64: "13.4.92"}}
          - {package: nvidia-cublas, index: pypi, version: "13.8.0.4"}
          - {package: nvidia-cudnn-cu13, index: pypi, version: "9.27.0.42"}
        exclusive_group: CUDAExecutionProvider
        requires: {vendor: nvidia, cc_min: "7.5", driver_branch_min: 580}
        ort: {verified_by_us: ["1.30.0"]}
        licences:
          - {name: ONNX Runtime CUDA EP, url: "https://github.com/microsoft/onnxruntime/blob/main/LICENSE"}
          - {name: NVIDIA CUDA Runtime, url: "https://pypi.org/project/nvidia-cuda-runtime/"}
          - {name: NVIDIA cuBLAS, url: "https://pypi.org/project/nvidia-cublas/"}
          - {name: NVIDIA cuDNN, url: "https://pypi.org/project/nvidia-cudnn-cu13/"}
        status: ready
  coreml:
    kind: builtin
    gpu: true
    display_name: Apple Core ML
    description: "Runs on Apple silicon with Core ML, is a part of skellytracker on macOS and needs no download."
    ep_name: CoreMLExecutionProvider
    platforms: [macosx_arm64]
    precision_order: [fp16, fp32]
    l3_atol: 1.5e-2
    options:
      allowed: {MLComputeUnits: [ALL, CPUAndGPU, CPUAndNeuralEngine, CPUOnly]}
      defaults: {}
  directml:
    kind: builtin
    gpu: true
    selects_gpu: true
    display_name: DirectML
    description: "Runs on DirectX 12 GPUs on Windows, is a part of skellytracker and needs no download. It is in a field test."
    ep_name: DmlExecutionProvider
    platforms: [win_amd64]
    precision_order: [fp16, fp32]
    l3_atol: 1.5e-2
    options: {allowed: {}, defaults: {}}
    # The app offers DirectML for AMD GPUs only. A reviewed passing report of the certify suite moves it to `ready`.
    status: field-test
  cpu:
    kind: builtin
    gpu: false
    display_name: CPU
    description: "Runs on the processor of each computer, is a part of skellytracker and needs no download."
    ep_name: CPUExecutionProvider
    precision_order: [fp32]
    options: {allowed: {}, defaults: {}}
  trt: {kind: reserved, reason: "classic TensorRT is a separate EP; it is not in v2"}
  openvino:
    kind: reserved
    reason: "OpenVINO is deferred: discrete Intel GPUs only"
    # A CI-only test vehicle for `selftest`. It is never offered, selected or installed for a user.
    test_packs:
      - id: openvino
        package: onnxruntime-ep-openvino
        version: "1.8.1"
        index: pypi
        ep_name: OpenVINOExecutionProvider
        library: {win_amd64: onnxruntime_providers_openvino_plugin.dll, manylinux_x86_64: libonnxruntime_providers_openvino_plugin.so}
        exclusive_group: OpenVINOExecutionProvider
        licences:
          - {name: ONNX Runtime OpenVINO EP, url: "https://pypi.org/project/onnxruntime-ep-openvino/"}
        status: test
  qnn: {kind: reserved, reason: "QNN is deferred"}
  migraphx: {kind: reserved, reason: "MIGraphX is deferred"}
  vitisai: {kind: reserved, reason: "Vitis AI is deferred"}

# The EP keys that a setting of an older release can hold, each with its successors in order.
# Only `suggest_execution_provider()` reads this table (ADR-4CB1). A request for one of these keys
# does not change: `cuda` runs on `cuda`, `trt` stays reserved, and `directml` stays in its field test.
# `directml` has no successor, so an older setting never gives a field-test EP.
# A key with no successor has an empty list. Each successor is an EP key that is not reserved.
# When classic TensorRT comes back under the key `trt`, the row of `trt` must leave this table.
legacy_keys:
  trt: [trt-rtx, cuda]
  cuda: [trt-rtx, cuda]
  directml: []

# The first row that a GPU of the host (or the host) matches gives the candidates, in order.
# `ranking_evidence` is a decision entry ID, `single-ep`, or `none` (the order is not measured).
# No benchmark runs on the host. A row with `offer: update-driver` or `offer: none-available` must have
# `note`: the text that an application shows for the offer. An `add-pack` offer gets the install command.
hardware_classes:
  # The NVML brands of data center GPUs are an assumption. No data center host tested this row.
  - {id: nvidia-datacenter-r580, match: {vendor: nvidia, brand: [tesla, nvidia], os: Linux, cc_min: "7.5", driver_branch_min: 580},
     candidates: [cuda, cpu], offer: add-pack, ranking_evidence: none}
  - {id: nvidia-cc80-r580, match: {vendor: nvidia, cc_min: "8.0", driver_branch_min: 580},
     candidates: [trt-rtx, cuda, cpu], offer: add-pack, ranking_evidence: MWY9}
  - {id: nvidia-cc80-pre580, match: {vendor: nvidia, cc_min: "8.0"},
     candidates: [cpu], offer: update-driver, note: "Update the NVIDIA driver to R580 or later. Then run `skellytracker-eps install trt-rtx`.", ranking_evidence: single-ep}
  - {id: nvidia-cc75-r580, match: {vendor: nvidia, cc_min: "7.5", driver_branch_min: 580},
     candidates: [cuda, cpu], offer: add-pack, ranking_evidence: none}
  - {id: nvidia-cc75-pre580, match: {vendor: nvidia, cc_min: "7.5"},
     candidates: [cpu], offer: update-driver, note: "Update the NVIDIA driver to R580 or later. Then run `skellytracker-eps install cuda`.", ranking_evidence: single-ep}
  - {id: nvidia-pre-turing, match: {vendor: nvidia},
     candidates: [cpu], offer: none-available, note: "Use the CPU EP. CUDA 13 has no kernels for this GPU.", ranking_evidence: single-ep}
  - {id: intel-gpu, match: {vendor: intel}, candidates: [cpu], ranking_evidence: single-ep}
  # `recommend()` skips `directml` while it is a `field-test` EP.
  - {id: amd-windows, match: {vendor: amd, os: Windows},
     candidates: [directml, cpu], offer: none-available, note: "Use the CPU EP. This release has no tested GPU EP for AMD GPUs.", ranking_evidence: none}
  - {id: amd-deferred, match: {vendor: amd},
     candidates: [cpu], offer: none-available, note: "Use the CPU EP. This release has no GPU EP for AMD GPUs.", ranking_evidence: single-ep}
  - {id: apple-silicon, match: {host: true, os: Darwin, arch: arm64}, candidates: [coreml, cpu], ranking_evidence: none}
  - {id: snapdragon-x, match: {host: true, os: Windows, native_arch: ARM64}, candidates: [cpu], ranking_evidence: single-ep}
  - {id: unknown-gpu, match: {}, candidates: [cpu], ranking_evidence: single-ep}
  - {id: cpu-only, match: {host: true}, candidates: [cpu], ranking_evidence: single-ep}

# The certification run of `skellytracker-eps certify` (ADR-MF2R).
# `image` is a public test image. No camera frame is in this repository. `seconds` is the time of the
# wider run for each EP key, for the question to the user. `thresholds` compares the EP with the CPU EP.
certification:
  pipeline: yolox-rtmw-wholebody@skellytracker
  image:
    url: https://github.com/freemocap/skellysamples/releases/download/single_images_v07_12_26/sample_recording_a_pose_image.jpg
    sha256: 5ec5b9e3a587ba06c8f9d0dfbc9749dda31c3380ab7f67d2395f267db79a580d
    bytes: 212902
  seconds: {trt-rtx: 60, cuda: 30}
  # `keypoint_box_fraction_max` is a part of the diagonal of the person box. On 2026-11-18, one RTX 3070 gave
  # 0.0047 for `trt-rtx` and 0.0056 for `cuda` (5.2 px and 6.1 px on a box of 519 x 958 px), and a box IoU of
  # 0.999 and 0.989 (ADR-MF2R). One step of the keypoint decode is about 2.3 px on that box.
  thresholds: {box_iou_min: 0.9, keypoint_box_fraction_max: 0.01, score_min: 0.4}
