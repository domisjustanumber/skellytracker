    { name = "nvidia-cudnn-cu12", marker = "sys_platform != 'darwin' and extra == 'onnx-trt'" },
    { name = "nvidia-cufft-cu12", marker = "sys_platform != 'darwin' and extra == 'onnx-cuda'" },
