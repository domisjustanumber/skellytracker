    { name = "onnxruntime-gpu", marker = "sys_platform != 'darwin' and extra == 'onnx-trt'", specifier = "<1.27" },
    { name = "opencv-contrib-python" },
    { name = "polars" },
    { name = "pydantic", specifier = "==2.*" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "requests", specifier = ">=2.32.3" },
    { name = "scipy" },
    { name = "skellytracker", extras = ["all-cpu"], marker = "extra == 'recommended-cpu'" },
    { name = "skellytracker", extras = ["all-trt"], marker = "extra == 'recommended-cuda'" },
    { name = "skellytracker", extras = ["mediapipe", "onnx", "onnx-cpu"], marker = "extra == 'all-cpu'" },
