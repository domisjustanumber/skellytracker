# Split manifest for specs/sidecar-spec.md (move only, no rewording).
#
# Line numbers refer to specs/sidecar-spec.md at commit 5c7c68d (tip of dom/sidecar-spec-fixes;
# the spec does not change after it). Get it with `git show 5c7c68d:specs/sidecar-spec.md`.
#
# Block types (in `blocks`, in output order):
#   {h: N, text: "..."}        a new heading of level N (# count). The H1 of a section file is `title`.
#   {lines: [a, b]}            copy old lines a..b verbatim (inclusive). Leading/trailing blank lines are
#                              trimmed; inner lines (including blank lines and fenced code) are kept exactly.
#   {line: a}                  copy one old line verbatim.
#   {header: [a, b]}           copy the table header and separator lines a..b again (a declared repeat).
#   {rules: [l1, l2, ...]}     old checklist lines, each prefixed with its rule ID label (see rule_ids).
#   {legacy: [l1, l2, ...]}    old compatibility-table rows, emitted under a copy of the table header
#                              (lines 1012-1013).
#   {nav: "..."}               a declared added navigation line (links only; no normative text).
#   {generated: <name>}        generated navigation (see `generated` below).
#
# Joining: consecutive blocks are separated by exactly one blank line, except when the last emitted line
# of a block and the first emitted line of the next block both start with `|`: then they are joined with
# a single newline (one table continued under its header). A {nav} or {generated} block is always
# separated by a blank line. The lines of one {rules} or {legacy} block form one list or table.
# Legacy headings are "## Legacy behaviour"; the copied table header (old 1012-1013) carries the version.
# `link_overrides` take precedence over `anchors` for the named old line and old link target.
# Each section file starts with front matter (id, title, kind only), then "# <title>", then blocks.
# Every section file ends with the empty headings "## Implementer guidance" and "## Authoring guidance",
# in that order, after the normative headings and before "## Examples" when the file has examples.
#
# Links: every relative link in copied text is rewritten. A link to an old in-spec anchor goes to the
# new location of that heading (see `anchors`), as a path relative to the new file. A link to a file is
# re-based to the new file's folder. Link text never changes. Links inside fenced code and inline code
# are never changed.

