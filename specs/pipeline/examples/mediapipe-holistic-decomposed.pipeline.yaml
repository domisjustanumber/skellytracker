# Spec example, structure only. It sketches the MediaPipe pose and hand chain with onnx_model and
# glue nodes: redetect_trigger, a pose detector, a box from the points of the previous frame (@prev),
# first_of, smooth_boxes, hold_boxes, gate and smooth_keypoints. Both hands run from frame 0: an
# empty optional input (`previous_keypoints` of hold_boxes on frame 0) does not stop a node.
# The model keys and sizes wait for the sidecar proposals of MediaPipe-Exporter.
schema_version: "2.0.0"
pipeline_id: mediapipe-holistic-decomposed
source: {name: skellytracker, version: "2.0.0"}
description: >-
  Structure only: waits for sidecar proposals. MediaPipe pose and both hands as onnx_model and glue
  nodes.
nodes:
  # Ask for a new pose detection when the previous frame has no good pose.
  - id: trigger
    type: redetect_trigger
    inputs: {image: frame.image, previous_keypoints: body.keypoints@prev}
  - id: pose_detector
    type: onnx_model
    inputs: {image: trigger.image}
    params: {key: mediapipe-pose-detector@mediapipe-exporter, size: full}
  # The pose box from the points of the previous frame.
  - id: pose_box_prev
    type: boxes_from_points
    inputs: {keypoints: body.keypoints@prev}
    params:
      points: [body/left_hip, body/right_hip, body/nose]
      derived_points:
        hip_center: [body/left_hip, body/right_hip]
      size_rule: alignment
      alignment_start: hip_center
      alignment_end: body/nose
      target_rotation_deg: 90
      square_long: true
      expand_ratio: 1.25
  - id: pose_box
    type: first_of
    inputs: [pose_detector.boxes, pose_box_prev.boxes]
  - id: pose_box_smooth
    type: smooth_boxes
    inputs: {boxes: pose_box.value}
  - id: body
    type: onnx_model
    inputs: {image: frame.image, boxes: pose_box_smooth.boxes}
    params: {key: mediapipe-pose-landmarker@mediapipe-exporter, size: full}
  # The right hand box from the pose points, kept stable with hold_boxes.
  - id: right_hand_box
    type: boxes_from_points
    inputs: {keypoints: body.keypoints}
    params:
      points: [body/right_wrist, body/right_index, body/right_pinky]
      size_rule: alignment
      alignment_start: body/right_wrist
      alignment_end: body/right_index
      target_rotation_deg: 90
      square_long: true
      expand_ratio: 2.7
  - id: right_hand_tracked
    type: hold_boxes
    inputs:
      previous: right_hand_tracked.boxes@prev
      current: right_hand_box.boxes
      previous_keypoints: right_hand.keypoints@prev
  - id: right_hand_gate
    type: gate
    inputs: {value: right_hand_tracked.boxes, condition: body.keypoints}
    params: {mode: score_above, threshold: 0.5}
  - id: right_hand
    type: onnx_model
    inputs: {image: frame.image, boxes: right_hand_gate.value}
    params: {key: mediapipe-hand-landmarker@mediapipe-exporter, size: full}
  # The left hand: the same chain on the left points.
  - id: left_hand_box
    type: boxes_from_points
    inputs: {keypoints: body.keypoints}
    params:
      points: [body/left_wrist, body/left_index, body/left_pinky]
      size_rule: alignment
      alignment_start: body/left_wrist
      alignment_end: body/left_index
      target_rotation_deg: 90
      square_long: true
      expand_ratio: 2.7
  - id: left_hand_tracked
    type: hold_boxes
    inputs:
      previous: left_hand_tracked.boxes@prev
      current: left_hand_box.boxes
      previous_keypoints: left_hand.keypoints@prev
  - id: left_hand_gate
    type: gate
    inputs: {value: left_hand_tracked.boxes, condition: body.keypoints}
    params: {mode: score_above, threshold: 0.5}
  - id: left_hand
    type: onnx_model
    inputs: {image: frame.image, boxes: left_hand_gate.value}
    params: {key: mediapipe-hand-landmarker@mediapipe-exporter, size: full}
  - id: body_smooth
    type: smooth_keypoints
    inputs: {keypoints: body.keypoints}
outputs:
  body: body_smooth.keypoints
  right_hand: right_hand.keypoints
  left_hand: left_hand.keypoints
