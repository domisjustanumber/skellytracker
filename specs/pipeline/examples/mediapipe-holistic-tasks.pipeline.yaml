# Built-in pipeline of v2.0.0. It shows one mediapipe_tasks node: the MediaPipe Holistic
# landmarker on the full frame. Holistic is single person, so max_instances is 1. The points
# have the prefixes body, right_hand, left_hand and face, in this order. The output is
# geometry 3d with depth_unit pixel: z is the MediaPipe depth, scaled by the image width.
schema_version: "2.0.0"
pipeline_id: mediapipe-holistic-tasks
source: {name: skellytracker, version: "2.0.0"}
description: MediaPipe Holistic, one Tasks landmarker on the full frame.
nodes:
  - id: holistic
    type: mediapipe_tasks
    inputs: {image: frame.image}
    params: {variant: holistic}
outputs:
  holistic: holistic.keypoints
