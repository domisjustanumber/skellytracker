schema_version: "2.0.0"
pipeline_id: rtmpose-hand-detector
source: {name: skellytracker, version: "2.0.0"}
description: |-
  Structure only. YOLOX person then RTMPose body, and an RTMDet hand detector then RTMPose hand;
  merge joins the hands to the body.

  Spec example, structure only. It shows two chains on one frame: a person detector and a body
  model, and a hand detector (two hands) and a hand model. The hands have their own instance source,
  so concat cannot join them to the body. merge puts each hand row in the slot of a body wrist, with
  the smallest total distance, and replaces the body wrists with the hand roots.
nodes:
  - id: person
    type: onnx_model
    inputs: {image: frame.image}
    params:
      key: yolox-person@openmmlab-exporter
      size: m
      object_decode:
        nms: {post_nms_top_k: 1}
  - id: body
    type: onnx_model
    inputs: {image: frame.image, boxes: person.boxes}
    params: {key: rtmpose-body17@openmmlab-exporter, size: m}
  - id: hands
    type: onnx_model
    inputs: {image: frame.image}
    params: {key: rtmdet-hand@openmmlab-exporter, size: m, max_instances: 2}
  - id: hand
    type: onnx_model
    inputs: {image: frame.image, boxes: hands.boxes}
    params: {key: rtmpose-hand21@openmmlab-exporter, size: m}
  - id: body_hands
    type: merge
    inputs: {target: body.keypoints, source: hand.keypoints}
    params:
      slots: {right_hand: body/right_wrist, left_hand: body/left_wrist}
      source_anchor: hand/root
      max_distance: 0.15
      map: {body/right_wrist: right_hand/root, body/left_wrist: left_hand/root}
outputs:
  wholebody: body_hands.keypoints
