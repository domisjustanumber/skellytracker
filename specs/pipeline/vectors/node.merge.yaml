  - id: a-slot-named-like-a-target-group-replaces-it-through-the-canonical-names
    note: "the slot left_hand replaces the group left_hand of target: no column is added.
      left_hand_root and left_thumb1 get the source points with the same canonical names
      (wrist, thumb_cmc). left_forefinger1 has no source point with its canonical name, so
      it is missing, also though target had a value: the load gives the warning
      merge_unfilled_points. The group body does not change"
    params: {slots: {left_hand: body/left_wrist}, source_anchor: hand/root, max_distance: 1}
    input:
      target:
        point_names:
          - body/left_wrist
          - body/right_wrist
          - left_hand/left_hand_root
          - left_hand/left_thumb1
          - left_hand/left_forefinger1
        xy: [[[100, 100], [200, 100], [90, 110], [85, 120], [80, 115]]]
        score: [[0.9, 0.9, 0.5, 0.5, 0.5]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
      source:
        point_names: [hand/root, hand/thumb1]
        xy: [[[95, 105], [92, 112]]]
        score: [[0.7, 0.7]]
        instance_score: [0.9]
        present: [true]
        track_ids: [-1]
        instance_source: hands
        geometry: "2d"
      target_names:
        - body/left_wrist
        - body/right_wrist
        - left_hand/left_hand_root
        - left_hand/left_thumb1
        - left_hand/left_forefinger1
      source_names: [hand/root, hand/thumb1]
      canonical:
        left_hand/left_hand_root: wrist
        left_hand/left_thumb1: thumb_cmc
        left_hand/left_forefinger1: index_finger_mcp
        hand/root: wrist
        hand/thumb1: thumb_cmc
    expect:
      keypoints:
        point_names:
          - body/left_wrist
          - body/right_wrist
          - left_hand/left_hand_root
          - left_hand/left_thumb1
          - left_hand/left_forefinger1
        xy: [[[100, 100], [200, 100], [95, 105], [92, 112], [.nan, .nan]]]
        score: [[0.9, 0.9, 0.7, 0.7, 0]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
