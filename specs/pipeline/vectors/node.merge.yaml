# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: node.merge
notes:
  - "Normative text: specs/pipeline/nodes/merge.md."
  - "`target` and `source` are `keypoints` values: null (empty) or a mapping with
    `point_names`, `xy` (I rows of P points [x, y]), `score` (I rows of P scores),
    `instance_score`, `present` and `track_ids` (I values each), and the facts of its
    output schema `instance_source` and `geometry`. `target_names` and `source_names`
    are the point names of the two ports from their output schemas, known at load, also
    for an empty value. `canonical` maps a point name of `target` or `source` to its
    canonical point name, from the passthrough entries of the canonical mapping of its
    schema, known at load. A point with no such entry is not a key. An absent
    `canonical` holds no names. Only a `3d` value has `z` (I rows of P depths). A `2d`
    value has no `z`."
tolerance: 0
verified_against:
  - skellytracker/core/pipelines/_runtime/node_merge.py::run
cases:
  - id: a-new-slot-name-adds-a-group-and-the-output-keeps-the-target-rows
    note: "the right hand is nearest to the right wrist and the left hand to the left wrist;
      map replaces the body left wrist with the left-hand root, and the body right wrist
      stays; row 1 is a padding row and stays one; the instance scores, the track ids and
      the instance source are those of target"
    params:
      slots: {right_hand: body/right_wrist, left_hand: body/left_wrist}
      source_anchor: hand/root
      max_distance: 1
      map: {body/left_wrist: left_hand/root}
    input:
      target:
        point_names: [body/left_wrist, body/right_wrist, body/nose]
        xy: [[[100, 100], [200, 100], [150, 50]], [[.nan, .nan], [.nan, .nan], [.nan, .nan]]]
        score: [[0.9, 0.9, 0.9], [0, 0, 0]]
        instance_score: [0.8, 0]
        present: [true, false]
        track_ids: [-1, -1]
        instance_source: person
        geometry: "2d"
      source:
        point_names: [hand/root, hand/tip]
        xy: [[[205, 110], [210, 130]], [[95, 105], [90, 125]]]
        score: [[0.7, 0.7], [0.6, 0.6]]
        instance_score: [0.3, 0.4]
        present: [true, true]
        track_ids: [-1, -1]
        instance_source: hands
        geometry: "2d"
      target_names: [body/left_wrist, body/right_wrist, body/nose]
      source_names: [hand/root, hand/tip]
    expect:
      keypoints:
        point_names:
          - body/left_wrist
          - body/right_wrist
          - body/nose
          - right_hand/root
          - right_hand/tip
          - left_hand/root
          - left_hand/tip
        xy:
          - [[95, 105], [200, 100], [150, 50], [205, 110], [210, 130], [95, 105], [90, 125]]
          - - [.nan, .nan]
            - [.nan, .nan]
            - [.nan, .nan]
            - [.nan, .nan]
            - [.nan, .nan]
            - [.nan, .nan]
            - [.nan, .nan]
        score: [[0.6, 0.9, 0.9, 0.7, 0.7, 0.6, 0.6], [0, 0, 0, 0, 0, 0, 0]]
        instance_score: [0.8, 0]
        present: [true, false]
        track_ids: [-1, -1]
        instance_source: person
        geometry: "2d"
  - id: the-assignment-has-the-smallest-total-distance
    note: "source row 0 is 12 from the left wrist and 18 from the right wrist; source row 1 is
      12 from the left wrist and 42 from the right wrist. The smallest total is 18 + 12 =
      30: row 0 goes to right_hand and row 1 to left_hand. A greedy match would give the
      left wrist to row 0 (the tie at 12 goes to the lower source row) and a total of 12 +
      42 = 54"
    params:
      slots: {right_hand: body/right_wrist, left_hand: body/left_wrist}
      source_anchor: hand/root
      max_distance: 10
    input:
      target:
        point_names: [body/left_wrist, body/right_wrist, body/nose]
        xy: [[[100, 100], [130, 100], [115, 60]]]
        score: [[0.9, 0.9, 0.9]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
      source:
        point_names: [hand/root, hand/tip]
        xy: [[[112, 100], [0, 0]], [[88, 100], [1, 1]]]
        score: [[0.7, 0.7], [0.6, 0.6]]
        instance_score: [0.9, 0.9]
        present: [true, true]
        track_ids: [-1, -1]
        instance_source: hands
        geometry: "2d"
      target_names: [body/left_wrist, body/right_wrist, body/nose]
      source_names: [hand/root, hand/tip]
    expect:
      keypoints:
        point_names:
          - body/left_wrist
          - body/right_wrist
          - body/nose
          - right_hand/root
          - right_hand/tip
          - left_hand/root
          - left_hand/tip
        xy: [[[100, 100], [130, 100], [115, 60], [112, 100], [0, 0], [88, 100], [1, 1]]]
        score: [[0.9, 0.9, 0.9, 0.7, 0.7, 0.6, 0.6]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
