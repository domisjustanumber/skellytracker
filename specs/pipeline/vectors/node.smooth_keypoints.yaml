# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: node.smooth_keypoints
notes:
  - "Normative text: specs/pipeline/nodes/smooth_keypoints.md."
  - "A case is one sequence. `frames` holds one item for each frame. An item is a list of
    instance rows, and a row is a list of points [x, y]. `.nan` is a missing value. A
    null item is an empty input. `keypoints` holds one output item for each input item.
    The score and z of a point and the instance_score of a row pass through unchanged,
    so the cases leave them out."
  - "`params` holds the params that the file writes. The other params take their defaults."
  - "dt is (timestamp_ms - previous timestamp_ms) / 1000, in seconds. A `video` case
    gives `fps` and no `timestamps_ms`: timestamp_ms = frame_index x 1000 / fps, as the
    run parameter `fps` of specs/pipeline/running.md. A `live` case gives
    `timestamps_ms`."
  - "Most cases run at 1000 ms per frame (`fps: 1`), so dt = 1 s and a value in Hz or in
    pixels per second has the number of the old value in frame units. The case
    kalman-defaults runs at 30 fps: the defaults are the old frame-unit defaults at 30
    fps, so it gives the results of the old frame-unit filter."
  - "A throwaway script ran the frame-unit version of the reference and the filters and
    the reset counters of skellytracker/core/temporal_processing/ (OneEuroFilter,
    KalmanFilter and KeypointResetPolicy, with the filter state cleared on a reset) on
    1400 random `video` sequences. The results agreed within 1e-9. The time-unit
    reference was not compared again."
tolerance: 0.000000001
unverified: "Only the reference ran the cases. The comparison with the skellytracker filters is
  in the notes, but that code has another signature, so it is not a verified_against
  entry."
cases:
  - id: one-euro-defaults
    note: "the first frame passes through; then alpha = 1 / (1 + 1 / (2 pi)) for each axis"
    params: {}
    input:
      running_mode: video
      fps: 1
      frames:
        - [[[0, 0], [100, 50]]]
        - [[[10, 0], [100, 50]]]
        - [[[20, 5], [102, 50]]]
        - [[[30, 5], [102, 50]]]
    expect:
      keypoints:
        - [[[0, 0], [100, 50]]]
        - [[[8.626974, 0], [100, 50]]]
        - [[[18.438454, 4.313487], [101.725395, 50]]]
        - [[[28.41257, 4.90574], [101.962296, 50]]]
  - id: one-euro-30-fps
    note: "the frames of one-euro-defaults at 30 fps: dt = 1/30 s gives a smaller alpha, so the
      smoothing is stronger"
    params: {}
    input:
      running_mode: video
      fps: 30
      frames: [[[[0, 0]]], [[[10, 0]]], [[[20, 5]]], [[[30, 5]]]]
    expect:
      keypoints: [[[[0, 0]]], [[[1.731707, 0]]], [[[4.895241, 0.865854]]], [[[9.24265, 1.581767]]]]
  - id: one-euro-speed-coefficient
    note: "beta adds 0.1 x |dx| to the cutoff, so a fast point gets less smoothing"
    params: {min_cutoff: 0.5, beta: 0.1, d_cutoff: 2}
    input:
      running_mode: video
      fps: 1
      frames: [[[[0, 0]]], [[[10, 0]]], [[[20, 5]]], [[[30, 5]]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[8.996149, 0]]]
        - [[[18.997361, 4.290942]]]
        - [[[29.004184, 4.851312]]]
  - id: kalman-defaults
    note: "constant velocity at 30 fps with the defaults: predict, then update with gain =
      cov[:, 0] / (cov00 + measurement_noise) on each axis; the noise is diag(30, 2700) x
      dt"
    params: {filter: kalman}
    input:
      running_mode: video
      fps: 30
      frames: [[[[0, 0]]], [[[10, 0]]], [[[20, 5]]], [[[30, 5]]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[9.173554, 0]]]
        - [[[16.784566, 3.392283]]]
        - [[[26.990311, 5.005293]]]
  - id: one-euro-gap-hold
    note: "the point holds its last estimate for 2000 ms, is NaN at 3000 ms after its last
      detection, then starts again"
    params: {max_gap_ms: 2000}
    input:
      running_mode: video
      fps: 1
      frames:
        - [[[0, 0]]]
        - [[[10, 0]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[40, 0]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[8.626974, 0]]]
        - [[[8.626974, 0]]]
        - [[[8.626974, 0]]]
        - [[[.nan, .nan]]]
        - [[[40, 0]]]
  - id: kalman-gap-predicts
    note: "in a gap the output is the prediction est + v dt; a small measurement_noise follows
      the measurements more closely"
    params:
      filter: kalman
      process_noise_pos: 4
      process_noise_vel: 0.5
      measurement_noise: 2
      max_gap_ms: 2000
    input:
      running_mode: video
      fps: 1
      frames:
        - [[[0, 0]]]
        - [[[10, 0]]]
        - [[[20, 0]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[9.997784, 0]]]
        - [[[19.998385, 0]]]
        - [[[29.99253, 0]]]
        - [[[39.986675, 0]]]
        - [[[.nan, .nan]]]
  - id: velocity-rejection
    note: "the jump of 90 pixels in 1 s is more than max_velocity 15 px/s, so the point is
      held; the next point is 11.37 pixels from the estimate, 2 s after the last
      detection, so it passes (15 x 2 = 30)"
    params: {max_gap_ms: 1000, max_velocity: 15}
    input:
      running_mode: video
      fps: 1
      frames: [[[[0, 0]]], [[[10, 0]]], [[[100, 0]]], [[[20, 0]]]]
    expect: {keypoints: [[[[0, 0]]], [[[8.626974, 0]]], [[[8.626974, 0]]], [[[18.438454, 0]]]]}
  - id: reset-after-ms
    note: "the row has no valid point for 2000 ms at 3000 ms and at 6000 ms, so the state of
      the row is cleared and the hold ends; at 7000 ms the row starts again from the input"
    params: {max_gap_ms: 10000, reset_after_ms: 2000}
    input:
      running_mode: video
      fps: 1
      frames:
        - [[[0, 0]]]
        - [[[10, 0]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[50, 0]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[8.626974, 0]]]
        - [[[8.626974, 0]]]
        - [[[8.626974, 0]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[.nan, .nan]]]
        - [[[50, 0]]]
  - id: live-dt-and-empty-input
    note: "dt = 1, 1, 1 and 2 s; the empty input at 2000 ms is a frame with no point, 1000 ms
      after the last detection, and the point holds"
    params: {max_gap_ms: 1000}
    input:
      running_mode: live
      timestamps_ms: [0, 1000, 2000, 3000, 5000]
      frames: [[[[0, 0]]], [[[10, 0]]], null, [[[30, 0]]], [[[50, 0]]]]
    expect:
      keypoints:
        - [[[0, 0]]]
        - [[[8.626974, 0]]]
        - [[[8.626974, 0]]]
        - [[[27.065429, 0]]]
        - [[[48.309454, 0]]]
  - id: image-mode-passes-through
    note: "image mode keeps no state, so the output is the input"
    params: {}
    input: {running_mode: image, frames: [[[[0, 0]]], [[[10, 0]]]]}
    expect: {keypoints: [[[[0, 0]]], [[[10, 0]]]]}
  - id: refused-param-of-the-other-filter
    note: "beta is a one_euro param, and the filter is kalman"
    checks: [refused]
    params: {filter: kalman, beta: 0.1}
    input: {running_mode: video, frames: [[[[0, 0]]]]}
    expect: {error: V-node.smooth_keypoints-1}
  - id: refused-timestamp-not-increasing-live
    checks: [refused]
    params: {}
    input:
      running_mode: live
      timestamps_ms: [0, 40, 40]
      frames: [[[[0, 0]]], [[[10, 0]]], [[[20, 0]]]]
    expect: {error: V-node.smooth_keypoints-3}
  - id: refused-timestamp-not-increasing-video
    checks: [refused]
    params: {}
    input:
      running_mode: video
      timestamps_ms: [0, 40, 30]
      frames: [[[[0, 0]]], [[[10, 0]]], [[[20, 0]]]]
    expect: {error: V-node.smooth_keypoints-3}
