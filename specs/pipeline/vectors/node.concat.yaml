# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: node.concat
notes:
  - "Normative text: specs/pipeline/nodes/concat.md."
  - "`values` holds one `keypoints` value for each item of the `inputs` list, in list
    order. A value is null (empty) or a mapping with `point_names`, `xy` (I rows of P
    points [x, y]), `score` (I rows of P scores), `instance_score`, `present` and
    `track_ids` (I values each), and the facts of its output schema `instance_source`
    and `geometry`. A value with no present row is empty. `point_names` holds the point
    names of each input from its output schema, known at load, also for an empty input.
    Only a `3d` value has `z` (I rows of P depths). A `2d` value has no `z`."
tolerance: 0
verified_against:
  - skellytracker/core/pipelines/_runtime/node_concat.py::run
cases:
  - id: joins-row-i-of-each-input-in-list-order
    note: "row 0 is present in both inputs; row 1 is a padding row in both, so it stays a
      padding row"
    params: {}
    input:
      values:
        - point_names: [body/nose, body/left_wrist]
          xy: [[[10, 10], [20, 30]], [[.nan, .nan], [.nan, .nan]]]
          score: [[0.9, 0.9], [0, 0]]
          instance_score: [0.8, 0]
          present: [true, false]
          track_ids: [-1, -1]
          instance_source: person
          geometry: "2d"
        - point_names: [left_hand/wrist]
          xy: [[[21, 31]], [[.nan, .nan]]]
          score: [[0.9], [0]]
          instance_score: [0.8, 0]
          present: [true, false]
          track_ids: [-1, -1]
          instance_source: person
          geometry: "2d"
      point_names: [[body/nose, body/left_wrist], [left_hand/wrist]]
    expect:
      keypoints:
        point_names: [body/nose, body/left_wrist, left_hand/wrist]
        xy: [[[10, 10], [20, 30], [21, 31]], [[.nan, .nan], [.nan, .nan], [.nan, .nan]]]
        score: [[0.9, 0.9, 0.9], [0, 0, 0]]
        instance_score: [0.8, 0]
        present: [true, false]
        track_ids: [-1, -1]
        instance_source: person
        geometry: "2d"
  - id: a-null-input-gives-missing-points-in-its-columns
    note: "the left-hand input has no value; its columns are missing points: x and y NaN and
      the score 0"
    params: {}
    input:
      values:
        - point_names: [body/nose, body/left_wrist]
          xy: [[[10, 10], [20, 30]]]
          score: [[0.9, 0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
        - null
      point_names: [[body/nose, body/left_wrist], [left_hand/wrist, left_hand/tip]]
    expect:
      keypoints:
        point_names: [body/nose, body/left_wrist, left_hand/wrist, left_hand/tip]
        xy: [[[10, 10], [20, 30], [.nan, .nan], [.nan, .nan]]]
        score: [[0.9, 0.9, 0, 0]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
  - id: an-input-with-no-present-row-gives-missing-points-in-its-columns
    note: "the left-hand input has no present row, so it is empty"
    params: {}
    input:
      values:
        - point_names: [body/nose, body/left_wrist]
          xy: [[[10, 10], [20, 30]]]
          score: [[0.9, 0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
        - point_names: [left_hand/wrist, left_hand/tip]
          xy: [[[.nan, .nan], [.nan, .nan]]]
          score: [[0, 0]]
          instance_score: [0]
          present: [false]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
      point_names: [[body/nose, body/left_wrist], [left_hand/wrist, left_hand/tip]]
    expect:
      keypoints:
        point_names: [body/nose, body/left_wrist, left_hand/wrist, left_hand/tip]
        xy: [[[10, 10], [20, 30], [.nan, .nan], [.nan, .nan]]]
        score: [[0.9, 0.9, 0, 0]]
        instance_score: [0.8]
        present: [true]
        track_ids: [-1]
        instance_source: person
        geometry: "2d"
  - id: is-empty-when-each-input-is-empty
    params: {}
    input: {values: [null, null], point_names: [[body/nose], [left_hand/wrist]]}
    expect: {keypoints: null}
  - id: row-i-takes-the-instance-score-and-the-track-id-of-the-first-input-whose-row-i-is-present
    note: "row 1 of the left-hand input is a padding row, so row 1 takes the instance score 0.6
      and the track id 3 of the body input; the first input that is not empty would give 0
      and -1. The track ids are not -1 only to show the rule: this version has no
      `associate` node"
    params: {}
    input:
      values:
        - point_names: [left_hand/wrist]
          xy: [[[21, 31]], [[.nan, .nan]]]
          score: [[0.9], [0]]
          instance_score: [0.8, 0]
          present: [true, false]
          track_ids: [7, -1]
          instance_source: person
          geometry: "2d"
        - point_names: [body/nose]
          xy: [[[10, 10]], [[50, 50]]]
          score: [[0.9], [0.9]]
          instance_score: [0.8, 0.6]
          present: [true, true]
          track_ids: [7, 3]
          instance_source: person
          geometry: "2d"
      point_names: [[left_hand/wrist], [body/nose]]
    expect:
      keypoints:
        point_names: [left_hand/wrist, body/nose]
        xy: [[[21, 31], [10, 10]], [[.nan, .nan], [50, 50]]]
        score: [[0.9, 0.9], [0, 0.9]]
        instance_score: [0.8, 0.6]
        present: [true, true]
        track_ids: [7, 3]
        instance_source: person
        geometry: "2d"
  - id: mixed-instance-sources-are-refused
    checks: [refused]
    params: {}
    input:
      values:
        - point_names: [body/nose]
          xy: [[[10, 10]]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
        - point_names: [hand/wrist]
          xy: [[[1, 1]]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: hands
          geometry: "2d"
      point_names: [[body/nose], [hand/wrist]]
    expect: {error: V-node.concat-1}
  - id: colliding-point-names-are-refused
    checks: [refused]
    params: {}
    input:
      values:
        - point_names: [body/nose]
          xy: [[[10, 10]]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
        - point_names: [body/nose]
          xy: [[[1, 1]]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
      point_names: [[body/nose], [body/nose]]
    expect: {error: V-node.concat-2}
  - id: mixed-geometries-are-refused
    checks: [refused]
    params: {}
    input:
      values:
        - point_names: [body/nose]
          xy: [[[10, 10]]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "2d"
        - point_names: [face/tip]
          xy: [[[1, 1]]]
          z: [[1]]
          score: [[0.9]]
          instance_score: [0.8]
          present: [true]
          track_ids: [-1]
          instance_source: person
          geometry: "3d"
      point_names: [[body/nose], [face/tip]]
    expect: {error: V-node.concat-3}
