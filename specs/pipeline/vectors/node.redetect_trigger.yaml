# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: node.redetect_trigger
notes:
  - "Normative text: specs/pipeline/nodes/redetect_trigger.md."
  - "A case is one sequence. Each item of `frames` gives the `frame_index` and the
    `@prev` inputs of one frame. `previous_keypoints` is a list of instance rows, and a
    row is a list of points [x, y, score] or null (the row is not present).
    `previous_rois` is a list of instance rows, and a row is an ROI [cx, cy, w, h,
    rotation] or null (the row is not present). A null input is empty. A frame with no
    `previous_keypoints` key has `previous_keypoints` not connected. `rotation` is in
    radians. `triggered` is true for each frame where the node gives the image."
  - "A throwaway script ran the reference and
    skellytracker/core/temporal_processing/bbox_policy.py (BBoxPolicy.should_redetect,
    with the four checks) on 2700 random `video` sequences with rotation 0, one row,
    random intervals and the checks of these cases. The results were equal."
tolerance: 0.000000001
unverified: "Only the reference ran the cases. The comparison with BBoxPolicy.should_redetect is
  in the notes, but that method has another signature, so it is not a verified_against
  entry."
cases:
  - id: defaults-each-frame
    params: {}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 1, previous_keypoints: null, previous_rois: null}
        - {frame_index: 2, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, true, true]}
  - id: redetect-interval
    note: "a trigger on frame 0, then when frame_index - last trigger >= 3"
    params: {redetect_interval: 3}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 1, previous_keypoints: null, previous_rois: null}
        - {frame_index: 2, previous_keypoints: null, previous_rois: null}
        - {frame_index: 3, previous_keypoints: null, previous_rois: null}
        - {frame_index: 4, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, false, false, true, false]}
  - id: live-frame-number-skips
    note: "the interval counts frame numbers, so a skip counts"
    params: {redetect_interval: 3}
    input:
      running_mode: live
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 2, previous_keypoints: null, previous_rois: null}
        - {frame_index: 3, previous_keypoints: null, previous_rois: null}
        - {frame_index: 7, previous_keypoints: null, previous_rois: null}
        - {frame_index: 8, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, false, true, true, false]}
  - id: min-keypoint-score
    note: "mean score of the valid points: 0.5 passes, 0.2 fails, no valid point passes; on the
      last frame row 1 fails"
    params: {redetect_interval: 100, fitness_checks: [{check: min_keypoint_score}]}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - frame_index: 1
          previous_keypoints: [[[10, 10, 0.4], [20, 20, 0.6], [.nan, .nan, 0]]]
          previous_rois: null
        - frame_index: 2
          previous_keypoints: [[[10, 10, 0.1], [20, 20, 0.3]]]
          previous_rois: null
        - frame_index: 3
          previous_keypoints: [[[.nan, .nan, 0], [.nan, .nan, 0]]]
          previous_rois: null
        - frame_index: 4
          previous_keypoints: [[[10, 10, 0.9], [20, 20, 0.9]], [[50, 50, 0.1], [60, 60, 0.1]]]
          previous_rois: null
    expect: {triggered: [true, false, true, false, true]}
  - id: keypoints-within-rotated-roi
    note: "rotation pi/2 turns the 100 x 20 ROI upright: 2 of 2 points are inside, then 1 of 3,
      then no ROI"
    params: {redetect_interval: 100, fitness_checks: [{check: keypoints_within_bbox_ratio}]}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - frame_index: 1
          previous_keypoints: [[[100, 140, 1], [100, 60, 1]]]
          previous_rois: [[100, 100, 100, 20, 1.5707963267948966]]
        - frame_index: 2
          previous_keypoints: [[[140, 100, 1], [60, 100, 1], [100, 140, 1]]]
          previous_rois: [[100, 100, 100, 20, 1.5707963267948966]]
        - frame_index: 3
          previous_keypoints: [[[140, 100, 1], [60, 100, 1]]]
          previous_rois: [null]
    expect: {triggered: [true, false, true, false]}
  - id: max-frames-without-redetect
    params:
      redetect_interval: 100
      fitness_checks: [{check: max_frames_without_redetect, n_frames: 2}]
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 1, previous_keypoints: null, previous_rois: null}
        - {frame_index: 2, previous_keypoints: null, previous_rois: null}
        - {frame_index: 3, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, false, true, false]}
  - id: bbox-area-collapse
    note: "the ROI area is 10000; 80 x 80 grows to 88 x 88 and passes; the two points with
      score 0.5 or more span 20 x 20, 22 x 22 < 0.25 x 10000 fails; one counted point
      fails; a row with no point fails; no ROI passes"
    params: {redetect_interval: 100, fitness_checks: [{check: bbox_area_collapse, min_score: 0.5}]}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - frame_index: 1
          previous_keypoints: [[[60, 60, 0.9], [140, 140, 0.9]]]
          previous_rois: [[100, 100, 100, 100, 0]]
        - frame_index: 2
          previous_keypoints: [[[90, 90, 0.9], [110, 110, 0.9], [0, 0, 0.1], [200, 200, 0.1]]]
          previous_rois: [[100, 100, 100, 100, 0]]
        - frame_index: 3
          previous_keypoints: [[[90, 90, 0.9], [110, 110, 0.2]]]
          previous_rois: [[100, 100, 100, 100, 0]]
        - frame_index: 4
          previous_keypoints: [[[.nan, .nan, 0], [.nan, .nan, 0]]]
          previous_rois: [[100, 100, 100, 100, 0]]
        - frame_index: 5
          previous_keypoints: [[[.nan, .nan, 0], [.nan, .nan, 0]]]
          previous_rois: [null]
    expect: {triggered: [true, false, true, true, true, false]}
  - id: missing-keypoint-row-fails-bbox-area-collapse
    note: "frame 1: the keypoint row is not present and its ROI is there, so bbox_area_collapse
      fails; min_keypoint_score passes, because the row is missing; frame 2: the ROI row
      is not present, so each check passes"
    params:
      redetect_interval: 100
      fitness_checks: [{check: bbox_area_collapse}, {check: min_keypoint_score}]
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 1, previous_keypoints: [null], previous_rois: [[100, 100, 100, 100, 0]]}
        - {frame_index: 2, previous_keypoints: [null], previous_rois: [null]}
    expect: {triggered: [true, true, false]}
  - id: keypoints-not-connected-pass-bbox-area-collapse
    note: "previous_keypoints is not connected, so bbox_area_collapse passes although the ROI
      is there"
    params: {redetect_interval: 100, fitness_checks: [{check: bbox_area_collapse}]}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_rois: null}
        - {frame_index: 1, previous_rois: [[100, 100, 100, 100, 0]]}
    expect: {triggered: [true, false]}
  - id: image-mode-each-frame
    params: {redetect_interval: 5}
    input:
      running_mode: image
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, true]}
  - id: refused-field-of-another-check
    note: "n_frames is a field of max_frames_without_redetect"
    checks: [refused]
    params: {fitness_checks: [{check: min_keypoint_score, n_frames: 3}]}
    input:
      running_mode: video
      frames: [{frame_index: 0, previous_keypoints: null, previous_rois: null}]
    expect: {error: V-node.redetect_trigger-1}
  - id: roi-missing
    note: "frame 0: `last` is empty. frame 1: the ROI row is there. frame 2: previous_rois is
      empty, so the check fails. frame 3: the row is not present, so the check fails.
      frame 4: the ROI row is there"
    params: {redetect_interval: 100, fitness_checks: [{check: roi_missing}]}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - frame_index: 1
          previous_keypoints: [[[10, 10, 0.9], [30, 40, 0.9]]]
          previous_rois: [[20, 25, 40, 60, 0]]
        - {frame_index: 2, previous_keypoints: null, previous_rois: null}
        - {frame_index: 3, previous_keypoints: [null], previous_rois: [null]}
        - frame_index: 4
          previous_keypoints: [[[10, 10, 0.9], [30, 40, 0.9]]]
          previous_rois: [[20, 25, 40, 60, 0]]
    expect: {triggered: [true, false, true, true, false]}
  - id: lost-person-checks
    note: "roi_missing with bbox_area_collapse, min_area_ratio 0 and min_score 0.4: the area
      test never fails. frame 1: a small box of good points passes. frame 2: no point has
      a score of 0.4 or more. frame 3: the counted points are on one vertical line. frame
      4: a score equal to 0.4 counts, so the check passes. frame 5: the detector found no
      box on the frame before"
    params:
      redetect_interval: 100
      fitness_checks:
        - {check: roi_missing}
        - {check: bbox_area_collapse, min_area_ratio: 0, min_score: 0.4}
    input:
      running_mode: video
      frames:
        - {frame_index: 0, previous_keypoints: null, previous_rois: null}
        - frame_index: 1
          previous_keypoints: [[[10, 10, 0.9], [11, 12, 0.9]]]
          previous_rois: [[200, 200, 400, 400, 0]]
        - frame_index: 2
          previous_keypoints: [[[10, 10, 0.39], [30, 40, 0.2]]]
          previous_rois: [[200, 200, 400, 400, 0]]
        - frame_index: 3
          previous_keypoints: [[[10, 10, 0.9], [10, 40, 0.9], [90, 90, 0.1]]]
          previous_rois: [[200, 200, 400, 400, 0]]
        - frame_index: 4
          previous_keypoints: [[[10, 10, 0.4], [30, 40, 0.4]]]
          previous_rois: [[200, 200, 400, 400, 0]]
        - {frame_index: 5, previous_keypoints: null, previous_rois: null}
    expect: {triggered: [true, false, true, true, false, true]}
  - id: refused-field-of-roi-missing
    note: "roi_missing has no field"
    checks: [refused]
    params: {fitness_checks: [{check: roi_missing, threshold: 0.5}]}
    input:
      running_mode: video
      frames: [{frame_index: 0, previous_keypoints: null, previous_rois: null}]
    expect: {error: V-node.redetect_trigger-1}
