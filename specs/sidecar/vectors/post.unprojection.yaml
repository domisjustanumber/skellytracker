# Test vectors for the section `post.unprojection`.
# Generated by tools/make_vectors.py. Do not edit this file by hand.
# A case with fractional numbers gives a `tolerance`. Compare each fractional number
# with an absolute difference of at most this value. Integers must match exactly.
# Normative text: specs/sidecar/post/unprojection.md. It uses the Inverse of each resize section
# (specs/sidecar/pre/resize-*.md) and, for a box, `clamp_boxes`
# (specs/sidecar/post/detection-decode.md).
# `scale` is `decode.box_scale` for a box and `pose.decode.coordinate_scale` for a keypoint.
# `input_size` is [height, width] of the model input. `resize` holds the `input.resize` fields that
# the Inverse uses.
# `decoded_xy` and `decoded_xyxy` are values from the model output, in the given `scale`, with a
# top-left origin. `model_xy` and `model_xyxy` are the same values in model-input pixels.
# `source_xy` and `source_xyxy` are the unprojected values.
# `output_xyxy` is the final box. It is the clamped `source_xyxy` unless `clamp_boxes` is false. The
# clamp here sets a negative value to 0.
# Every result is exact in float64 arithmetic with the formulas of the sections, so no case gives a
# `tolerance`.
# The spec does not define the upper bound of the clamp ([0, W] or [0, W - 1]) or the result for a
# box without area after the clamp (notes/decisions/README.md, Open work). No case reaches the upper
# bound or loses its area, so these open questions change no result.
section: post.unprojection
spec_revision: vNEXT
generated_by: tools/make_vectors.py
unverified: "No independent implementation has run these vectors yet. They come from the section
