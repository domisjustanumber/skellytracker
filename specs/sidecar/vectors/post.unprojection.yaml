    input: {src_w: 1920, src_h: 1080, decoded_xyxy: [-20, 100, 200, 400]}
    expect:
      model_xyxy: [-20, 100, 200, 400]
      source_xyxy: [-60, -120, 600, 780]
      output_xyxy: [0, 0, 600, 780]
  - id: box-clamp-boxes-false-keeps-negative-values
    # the same box with clamp_boxes false: the output is the unprojected box
    params:
      scale: pixel
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
      clamp_boxes: false
    input: {src_w: 1920, src_h: 1080, decoded_xyxy: [-20, 100, 200, 400]}
    expect:
      model_xyxy: [-20, 100, 200, 400]
      source_xyxy: [-60, -120, 600, 780]
      output_xyxy: [-60, -120, 600, 780]
  - id: box-clamp-after-the-scale-conversion
    # the box starts in the top padding: y1 = -420 becomes 0
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
