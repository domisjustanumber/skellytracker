cases:
  - id: pixel-is-the-model-input-position
    # no conversion: s = 1/3 and top = 140, so y_src = (320 - 140) * 3 = 540
    params:
      scale: pixel
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [320, 320]}
    expect: {model_xy: [320, 320], source_xy: [960, 540]}
  - id: normalized-01-centre
    # 0.5 * 640 = 320: the same result as the pixel case, because the conversion comes first
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [0.5, 0.5]}
    expect: {model_xy: [320, 320], source_xy: [960, 540]}
  - id: normalized-01-top-left-corner
    # the top of the model input is padding: y_src = (0 - 140) * 3 = -420
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [0, 0]}
    expect: {model_xy: [0, 0], source_xy: [0, -420]}
  - id: normalized-01-bottom-right-corner
    # 1 maps to x = 640, the right edge of the model input, and not to 639
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [1, 1]}
    expect: {model_xy: [640, 640], source_xy: [1920, 1500]}
  - id: normalized-11-left-edge
    # -1 maps to x = 0, the left edge of the model input, and not to the centre of pixel 0
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [-1, 0]}
    expect: {model_xy: [0, 320], source_xy: [0, 540]}
  - id: normalized-11-right-edge
    # 1 maps to x = 640, the right edge, and not to the centre of the last pixel
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [1, 0]}
    expect: {model_xy: [640, 320], source_xy: [1920, 540]}
  - id: normalized-11-centre  # 0 maps to the middle of the model input: (320, 320)
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [0, 0]}
    expect: {model_xy: [320, 320], source_xy: [960, 540]}
  - id: normalized-11-off-centre  # (-0.5 + 1) / 2 * 640 = 160 and (0.5 + 1) / 2 * 640 = 480
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [-0.5, 0.5]}
    expect: {model_xy: [160, 480], source_xy: [480, 1020]}
  - id: normalized-01-non-square-input
    # target_size [384, 640] is 640 wide and 384 high: x scales with 640 and y with 384. top = 12
    params:
      scale: normalized_01
      input_size: [384, 640]
      resize:
        method: letterbox
        target_size: [384, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [0.5, 0.5]}
    expect: {model_xy: [320, 192], source_xy: [960, 540]}
  - id: normalized-11-non-square-input  # x = 640 and y = 0; y_src = (0 - 12) * 3 = -36
    params:
      scale: normalized_11
      input_size: [384, 640]
      resize:
        method: letterbox
        target_size: [384, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xy: [1, -1]}
    expect: {model_xy: [640, 0], source_xy: [1920, -36]}
  - id: normalized-01-letterbox-top-left
    # (640, 360) is the bottom-right corner of the resized image: the source corner
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: top_left
        rounding: half_up
    input: {src_w: 1920, src_h: 1080, decoded_xy: [1, 0.5625]}
    expect: {model_xy: [640, 360], source_xy: [1920, 1080]}
  - id: normalized-01-stretch
    # (160, 480) in model-input pixels; x_src = 160 * 1920 / 640, y_src = 480 * 1080 / 640
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize: {method: stretch, target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, decoded_xy: [0.25, 0.75]}
    expect: {model_xy: [160, 480], source_xy: [480, 810]}
  - id: normalized-11-stretch
    # the far corner of the model input maps to the far corner of the source
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize: {method: stretch, target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, decoded_xy: [1, 1]}
    expect: {model_xy: [640, 640], source_xy: [1920, 1080]}
  - id: normalized-01-fit  # fit does not round: s = 0.5, left = 0, top = 140
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize: {method: fit, target_size: [640, 640]}
    input: {src_w: 1280, src_h: 720, decoded_xy: [0.25, 0.5]}
    expect: {model_xy: [160, 320], source_xy: [320, 360]}
  - id: normalized-01-no-resize
    # method none: the model input is the source image; input_size is [480, 640]
    params: {scale: normalized_01, input_size: [480, 640], resize: {method: none}}
    input: {src_w: 640, src_h: 480, decoded_xy: [0.5, 0.25]}
    expect: {model_xy: [320, 120], source_xy: [320, 120]}
  - id: pixel-affine-person-crop
    # the centre of the target, (96, 128), maps to the centre of the person box, (148, 264); the box
    # is 96x128 and the scale is 2
    params:
      scale: pixel
      input_size: [256, 192]
      resize:
        method: affine_person_crop
        target_size: [256, 192]
        expand_ratio: 1
        maintain_aspect_ratio: true
    input: {bbox_xyxy: [100, 200, 196, 328], decoded_xy: [96, 128]}
    expect: {model_xy: [96, 128], source_xy: [148, 264]}
  - id: normalized-11-affine-person-crop
    # 0 maps to (96, 128) in model-input pixels: the same position as the pixel case
    params:
      scale: normalized_11
      input_size: [256, 192]
      resize:
        method: affine_person_crop
        target_size: [256, 192]
        expand_ratio: 1
        maintain_aspect_ratio: true
    input: {bbox_xyxy: [100, 200, 196, 328], decoded_xy: [0, 0]}
    expect: {model_xy: [96, 128], source_xy: [148, 264]}
  - id: box-normalized-01-inside-the-image
    # clamp_boxes is absent, so the default true applies; the box is inside the image and the clamp
    # changes nothing
    params:
      scale: normalized_01
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xyxy: [0.25, 0.4375, 0.75, 0.5625]}
    expect:
      model_xyxy: [160, 280, 480, 360]
      source_xyxy: [480, 420, 1440, 660]
      output_xyxy: [480, 420, 1440, 660]
  - id: box-normalized-11-edge-and-inside
    # x1 = -1 maps to 0: on the edge, so the clamp changes nothing
    params:
      scale: normalized_11
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xyxy: [-1, -0.5, 0, 0.5]}
    expect:
      model_xyxy: [0, 160, 320, 480]
      source_xyxy: [0, 60, 960, 1020]
      output_xyxy: [0, 60, 960, 1020]
  - id: box-clamp-default-is-true  # clamp_boxes is absent: x1 = -60 and y1 = -120 become 0
    params:
      scale: pixel
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
    input: {src_w: 1920, src_h: 1080, decoded_xyxy: [-20, 100, 200, 400]}
    expect:
      model_xyxy: [-20, 100, 200, 400]
      source_xyxy: [-60, -120, 600, 780]
      output_xyxy: [0, 0, 600, 780]
  - id: box-clamp-boxes-true  # the same box with clamp_boxes true
    params:
      scale: pixel
      input_size: [640, 640]
      resize:
        method: letterbox
        target_size: [640, 640]
        pad_position: center
        rounding: half_even
