# Test vectors for the section `post.det.selection.nms`.
# Generated by tools/make_vectors.py. Do not edit this file by hand.
# A case with fractional numbers gives a `tolerance`. Compare each fractional number
# with an absolute difference of at most this value. Integers must match exactly.
# Normative text: specs/sidecar/post/selection-nms.md and specs/sidecar/post/detection-decode.md.
# `params` use the names of the `decode` fields. `kept_rows` are 0-based row indexes of the input,
# `scores` and `class_ids` are the scores and the emitted class ids of the kept detections, in
# output order.
# The cases stop before the unprojection and the clamp. `boxes_xyxy`, when it is given, holds the
# kept boxes in model-input pixels. Every score and threshold gives the same result in float32 and
# in float64.
# `iou_threshold`, `score_threshold`, `class_agnostic` and `post_nms_top_k` are fields of the `nms`
# object; they are written without the `nms` key here. A case with `boxes` and `scores` has no class
# source.
# `confidence_threshold_default` is given as 0 in most cases, so that the last step keeps every
# survivor.
