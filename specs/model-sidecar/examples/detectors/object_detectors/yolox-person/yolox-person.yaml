  resize:
    method: letterbox
    pad_position: top_left
    rounding: half_up
    pad_value: 114
    interpolation: linear
batching:
  batch: 3
  batch_conversion:
    profile_id: static-batch-v1
outputs:
- name: boxes
  dtype:
    fp32: float32
    fp16: float32
  shape:
  - -1
  - -1
  - 4
  semantic: boxes
- name: scores
  dtype:
    fp32: float32
    fp16: float32
  shape:
  - -1
  - -1
  semantic: scores
object:
  classes:
  - person
  decode:
    selection: nms
    boxes_output: boxes
    scores_output: scores
    box_format: xyxy
    box_space: pixel
    min_score: 0.7
    clamp_boxes: false
    nms:
      iou_threshold: 0.65
      score_threshold: 0.01
      class_agnostic: false
