license:
  model:
    id: Apache-2.0
    url: https://github.com/open-mmlab/mmpose/blob/v1.3.2/LICENSE
  training_data:
  - name: COCO-WholeBody
    url: https://github.com/jin-s13/COCO-WholeBody
    use: training
    license:
      id: CC-BY-NC-4.0 AND LicenseRef-COCO-Images
      url: https://github.com/jin-s13/COCO-WholeBody#terms-of-use
  - name: AI Challenger (human keypoint)
    url: https://arxiv.org/abs/1711.06475
    use: training
    license:
      id: unknown
      unknown_reason: 'Checked 2026-11-06: challenger.ai is offline. The archived challenger.ai/terms (2018-08-11) is the
        contestant registration agreement (竞赛选手报名协议). Its 第三条 §1 keeps all rights in the provided images and data for the
        organiser, unless the separate dataset download agreement says otherwise. §2 asks for a fee when results depend on
        the base data. §3 allows use of the base data only for non-commercial research or teaching. The dataset download agreement
        (/terms/data) has no Wayback copy. The archived challenger.ai/dataset/keypoint (2019-06-23) does not hold the agreement
        text. GitHub AIChallenger/AI_Challenger_2017 has no license. arXiv 1711.06475 has no license statement and says the
        images were collected from Internet search engines. A web search found no copy of the download agreement.'
  - name: CrowdPose
    url: https://github.com/Jeff-sjtu/CrowdPose
    use: training
    license:
      id: unknown
      unknown_reason: 'Checked 2026-11-06: the GitHub Jeff-sjtu/CrowdPose README has no license section and no terms for the
        Google Drive download. The repository has no LICENSE file on master or main. arXiv 1812.00324 has no license statement.
        The images come from COCO, MPII and AI Challenger. Secondary sources disagree and are not used: arXiv 2606.07053 (TrioPose)
        says "CC BY 4.0 ... non-commercial", Roboflow says CC BY 4.0, hyper.ai says "Other".'
  - name: MPII Human Pose
    url: https://www.mpi-inf.mpg.de/departments/computer-vision-and-machine-learning/software-and-datasets/mpii-human-pose-dataset
    use: training
    license:
      id: BSD-2-Clause AND LicenseRef-MPII-Images
      url: https://www.mpi-inf.mpg.de/departments/computer-vision-and-machine-learning/software-and-datasets/mpii-human-pose-dataset/download
  - name: sub-JHMDB
    url: https://is.mpg.de/code/jhmdb-joint-annotated-human-motion-data-base
    use: training
    license:
      id: unknown
      unknown_reason: 'Checked 2026-11-06: the MPI-IS page is.mpg.de/code/jhmdb-joint-annotated-human-motion-data-base (archived
        2026-06-17; the live page is behind a bot wall) gives only ''licence_type: PS:License 1.0''. That label is a department-wide
        website label with no published text. MPI-IS also puts it on MIT (HMR), BSD-2-Clause (Monocle) and SMPL-type non-commercial
        items. jhmdb.is.tue.mpg.de refuses connections, and its archived pages have no license text. The videos come from
        HMDB51. The Brown HMDB page says CC BY 4.0, and the clips come from commercial films and YouTube.'
  - name: Halpe-FullBody
    url: https://github.com/Fang-Haoshu/Halpe-FullBody
    use: training
    license:
      id: unknown
      unknown_reason: 'Checked 2026-11-06: the GitHub Fang-Haoshu/Halpe-FullBody README has no license, only a citation request.
        The repository has no LICENSE file on master or main. A web search found no license. The images are HICO-DET train2015.
        The HICO-DET site websites.umich.edu/~ywchao/hico/ shows a bot wall. The archived www-personal.umich.edu/~ywchao/hico/
        (HTTP 200, 2016 to 2022-04-05) and the HICO-DET paper arXiv 1702.05448 have no license text. The Halpe paper arXiv
        2211.03375 says the HICO-DET images carry an unversioned ''Creative Common license'' and that the dataset is released
        through MVIG-SJTU/AlphaPose. AlphaPose is licensed for non-commercial use, but its LICENSE covers the software. HAKE
        (MIT) does not hold the Halpe data.'
  - name: PoseTrack18
    url: https://posetrack.net/
    use: training
    license:
      id: CC-BY-NC-4.0
      url: https://creativecommons.org/licenses/by-nc/4.0/
  - name: Human-Art
    url: https://idea-research.github.io/HumanArt/
    use: training
    license:
      id: CC-BY-NC-SA-4.0
      url: https://docs.google.com/document/d/19j-6GFOCYBDU4CxwRSKgORndse_j5iHGK0RCJ2TvXNQ/edit?usp=sharing
  - name: UBody
    url: https://osx-ubody.github.io/
    use: training
    license:
      id: CC-BY-NC-SA-4.0 AND LicenseRef-UBody-Media
      url: https://docs.google.com/document/d/1R-nn6qguO0YDkPKBleZ8NyrqGrjLXfJ7AQTTsATMYZc/edit?usp=sharing
  - name: WFLW
    url: https://github.com/wywu/LAB
    use: training
    license:
      id: unknown
      unknown_reason: 'Checked 2026-11-06: the official page wywu.github.io/projects/LAB/WFLW.html returns 404, and its archived
        copies (2019-10-21, 2026-09-30) have no license. The GitHub wywu/LAB README has no dataset license. wywu/LAB LICENSE
