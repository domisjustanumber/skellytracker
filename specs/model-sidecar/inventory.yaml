# specs/model-sidecar/inventory.yaml - docs-only. skellytracker does not read it at runtime.
# It is not the index of a remote sidecar folder (see decisions/entries/0016-sidecar-catalogs.md).
#
# examples: the provenance of each reference example under specs/model-sidecar/examples/, keyed by its path
# there. The procedure to provide or replace an example is in
# specs/model-sidecar/model-addition-workflow/reference-examples.md. Each example holds its own source (source.name and source.version), so an
# entry has no source key. An entry has these keys:
#   exporter              the exporter repo
#   exporter_path         the path of the exporter's copy, relative to the exporter repo
#   kind                  export: copied from exporter output; forecast: written from exporter code
#   exporter_layout_path  the exporter's own output path when it does not follow the spec's storage
#                         layout (an exporter defect), else null
#   tracked               whether exporter_path is tracked in git (most exports are untracked build
#                         output under exports/)
#   commit                the exporter commit of the code that writes the sidecar
#   edits                 the allowed edits made to the exporter's copy: "header comment removed",
#                         "source and hashes added" (tools/sidecar_refs.py --write --placeholder
#                         --source, while the exporter does not write these fields), and
#                         "spec change <ID>: <edit>" (a spec-forced edit; <ID> is the bare ID of the
#                         decision entry; see reference-examples.md, "When a spec change makes an
#                         example invalid")
#   notes                 known differences from the exporter's copy
#   bundle                the hand-over bundle of the copy, as <bundle id>@v<k>; provenance text, not a
#                         path (specs/model-sidecar/model-addition-workflow/hand-over.md). Optional:
#                         an example from before the bundles has no bundle key
# fragments: the provenance of each fragment under specs/model-sidecar/examples/ that has no package
# copy, keyed by its path there. A fragment is a YAML file that is not a sidecar, in shared/ or next to
# a sidecar. A fragment with a package copy has the same bytes as that copy and no entry. The copy is
# unchanged, so an entry has no kind and no edits. An entry has these keys:
#   exporter, exporter_path, tracked, commit  as for examples
#   notes                                     why the fragment is not in the package
# no_model: the sections that no model uses, keyed by section ID. The value is the reason of the
# user. The user adds an entry. TRACEABILITY.md shows the reason in the "No model" column, and the
# graduation gate accepts it in place of a kind: export example.

examples:
  detectors/object_detectors/yolo26/yolo26.yaml:
    exporter: Ultralytics-Exporter
    exporter_path: exports/detectors/object_detectors/yolo26/yolo26.yaml
    kind: forecast
    exporter_layout_path: null
    tracked: false
    commit: f52ef68
    edits:
      - "source and hashes added"
      - "spec change CNSN: int8 precision removed"
      - "spec change JB5J: batch groups 2 and 3 removed"
      - "spec change JAA4: batching {batch_axis: 0} replaced by batching {batch: 1}; the batch 1 group of each size flattened into onnx.precision_artifacts and onnx.output_shapes"
      - "spec change 90CE: input.layout and outputs[].rank removed"
      - 'spec change SS2E: schema_version set to "1"'
      - 'spec change 6GE2: schema_version set to "2.0.0"'
    notes: >-
      The exporter still writes schema_version v2024.09.1019 (yolo_sidecar.py). Its copy uses the keys
      preserve_aspect_ratio, requires_nms and may_include_non_person_classes, which the spec does not
      define (spec change 0QKK), no color_format,
      and the static output shape [1, 300, 6].

  detectors/keypoint_detectors/yolo26/body/yolo26-body.yaml:
    exporter: Ultralytics-Exporter
    exporter_path: exports/detectors/keypoint_detectors/yolo26/body/yolo26-body.yaml
    kind: forecast
    exporter_layout_path: null
    tracked: false
    commit: f52ef68
    edits:
      - "source and hashes added"
      - "spec change CNSN: int8 precision removed"
      - "spec change JB5J: batch groups 2 and 3 removed"
      - "spec change JAA4: batching {batch_axis: 0} replaced by batching {batch: 1}; the batch 1 group of each size flattened into onnx.precision_artifacts and onnx.output_shapes"
      - "spec change 90CE: input.layout and outputs[].rank removed; pose.geometry: 2d added; pose.decode.coordinate_scale removed"
      - 'spec change SS2E: schema_version set to "1"'
      - 'spec change 6GE2: schema_version set to "2.0.0"'
    notes: >-
      The exporter still writes schema_version v2024.09.1019. Its copy has the same undefined keys as
      yolo26.yaml and declares output0 twice (detections, then poses with keypoint_axis 2) instead of
      one detections output with packed_keypoints.

  detectors/object_detectors/rtmdet-person/rtmdet-person.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: exports/detectors/object_detectors/rtmdet-person/rtmdet-person.yaml
    kind: export
    exporter_layout_path: null
    tracked: false
    commit: eed3361
    edits:
      - "source and hashes added"
      - "spec change JB5J: nano batch group 2 and the medium batch 2 comment removed"
      - "spec change JAA4: batching {batch_axis: 0} replaced by batching {batch: 1}; the batch 1 group of each size flattened into onnx.precision_artifacts and onnx.output_shapes"
      - "spec change 90CE: input.layout and outputs[].rank removed; input.normalization imagenet_bgr replaced by imagenet"
      - 'spec change SS2E: schema_version set to "1"'
      - 'spec change 6GE2: schema_version set to "2.0.0"'
    notes: >-
      Same contract as the exporter's copy, except the batch form and the spec-forced edits: the example
      keeps only the batch 1 artifacts (spec change JB5J) in the flattened form (spec change JAA4). The
      exporter's copy has batching.batch_axis and batch_artifacts groups 1, 2 and 3 in nano and medium.
      It also has input.layout, outputs[].rank and imagenet_bgr (spec change 90CE).

  detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: exports/detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody.yaml
    kind: export
    exporter_layout_path: null
    tracked: false
    commit: eed3361
    edits:
      - "source and hashes added"
      - "spec change JAA4: batching {batch_axis: 0} replaced by batching {batch: 1}; the batch 1 group of each size flattened into onnx.precision_artifacts"
      - "spec change JAA4: onnx.output_shapes [1, -1, 384], [1, -1, 512] added to size m, read from the graph of exports/detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody-m_b1_fp32.onnx (SHA-256 49223a7eb69229587c10dd40666fb882b999a543b1a6366fdda00317ef6fdebc)"
      - "spec change JAA4: onnx.output_shapes [1, -1, 576], [1, -1, 768] added to size l-384, read from the graph of exports/detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody-l-384_b1_fp32.onnx (SHA-256 0459169e06d70ef0cea342826dda9db5b3776267f650df6237f18891be3d27a9)"
      - "spec change JAA4: the comment line of the other sizes split in two lines that name their output_shapes, read from the graphs of exports/detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody-l-256_b1_fp32.onnx (SHA-256 6ccf6d6161a43e5fb4428ed2f6de2d2663c933988bd18bbdff9f4f5cd87305c3) and rtmw-wholebody-x-256_b1_fp32.onnx (SHA-256 c830700e71aa761081622356817eb0ede44ca41a02d3611903a52b1f94ef0236), as m, and rtmw-wholebody-x-384_b1_fp32.onnx (SHA-256 2e31eff71186672b72a1d55be10da68861076e25626ab6d0752610b8167c608b), as l-384"
      - "spec change 90CE: input.layout removed; input.normalization imagenet_rgb replaced by imagenet; pose.geometry: 2d added"
      - 'spec change SS2E: schema_version set to "1"'
      - 'spec change 6GE2: schema_version set to "2.0.0"'
    notes: >-
      Drifted from the exporter's copy; replace it with the procedure. The example adds
      crop_policy.pad_value 0, refers to the shared coco133 skeleton fragments where the exporter inlines
      133 names and one edge set named wholebody, and has the overlay of skellytracker's package sidecar
      (rtmpose_skeleton, prefix groups, a face group) instead of the exporter's overlay.

  detectors/keypoint_detectors/rtmo/body/rtmo-body7.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: notes/decisions/rtmo-body7.yaml
    kind: export
    exporter_layout_path: exports/detectors/keypoint_detectors/rtmo/body7/rtmo-body7.yaml
    tracked: true
    commit: eed3361
    edits:
      - "header comment removed"
      - "source and hashes added"
      - "spec change JAA4: batching {batch_axis: 0} replaced by batching {batch: 1}; the batch 1 group of each size flattened into onnx.precision_artifacts"
      - "spec change JAA4: onnx.output_shapes [1, -1, -1], [1, -1, 17, 3] added to size m, read from the graph of exports/detectors/keypoint_detectors/rtmo/body7/rtmo-body7-m_b1_fp32.onnx (SHA-256 0dbaad50530f68b66b448f9f5be735fbe2cfd36b3a91bad7f8216b9ce2ab2250)"
      - "spec change 90CE: input.layout and outputs[].rank removed; pose.geometry: 2d added"
      - 'spec change SS2E: schema_version set to "1"'
      - 'spec change 6GE2: schema_version set to "2.0.0"'
    notes: >-
      The tracked copy was last committed at 38ed76f; the current writer (rtmo/sidecar.py at eed3361)
      writes the same contract, except the spec-forced edits. The exporter's exports/ copy adds fp16,
      batch groups 2 and 3 and sizes s, l and t.

fragments: {}

