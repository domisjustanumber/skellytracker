# specs/model-sidecar/inventory.yaml - docs-only. skellytracker does not read it at runtime.
# It is not the index of a remote sidecar folder (see notes/decisions/0016-sidecar-catalogs.md).
#
# examples: the provenance of each reference example under specs/model-sidecar/examples/, keyed by its path
# there. The procedure to provide or replace an example is in
# specs/model-sidecar/model-addition-workflow/reference-examples.md. Each example holds its own source (source.name and source.version), so an
# entry has no source key. An entry has these keys:
#   exporter              the exporter repo
#   exporter_path         the path of the exporter's copy, relative to the exporter repo
#   kind                  export: copied from exporter output; forecast: written from exporter code
#   exporter_layout_path  the exporter's own output path when it does not follow the spec's storage
#                         layout (an exporter defect), else null
#   tracked               whether exporter_path is tracked in git (most exports are untracked build
#                         output under exports/)
#   commit                the exporter commit of the code that writes the sidecar
#   edits                 the allowed edits made to the exporter's copy: "header comment removed",
#                         "source and hashes added" (tools/sidecar_refs.py --write --placeholder
#                         --source, while the exporter does not write these fields)
#   notes                 known differences from the exporter's copy
# proposed: models that an exporter plans to add; listed, but not matched to sections. One entry per
# model and exporter.
#   key       <model_id>@<source>: the model_id that the exporter's plan gives, and the name of the
#             exporter package
#   exporter  the exporter repo
#   plan      the exporter's plan for the model, as <repo>/plans/<file>; the plan is an untracked local
#             file of that repo
#   status    proposed
#   notes     what the model is and, when the spec has no section for it, the gap

examples:
  detectors/object_detectors/yolo26/yolo26.yaml:
    exporter: Ultralytics-Exporter
    exporter_path: exports/detectors/object_detectors/yolo26/yolo26.yaml
    kind: forecast
    exporter_layout_path: null
    tracked: false
    commit: f52ef68
    edits: ["source and hashes added"]
    notes: >-
      The exporter still writes schema_version v2024.09.1019 (yolo_sidecar.py). Its copy uses the legacy
      fields preserve_aspect_ratio, requires_nms and may_include_non_person_classes, no color_format,
      and the static output shape [1, 300, 6].

  detectors/keypoint_detectors/yolo26/body/yolo26-body.yaml:
    exporter: Ultralytics-Exporter
    exporter_path: exports/detectors/keypoint_detectors/yolo26/body/yolo26-body.yaml
    kind: forecast
    exporter_layout_path: null
    tracked: false
    commit: f52ef68
    edits: ["source and hashes added"]
    notes: >-
      The exporter still writes schema_version v2024.09.1019. Its copy has the same legacy fields as
      yolo26.yaml and declares output0 twice (detections, then poses with keypoint_axis 2) instead of
      one detections output with packed_keypoints.

  detectors/object_detectors/rtmdet-person/rtmdet-person.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: exports/detectors/object_detectors/rtmdet-person/rtmdet-person.yaml
    kind: export
    exporter_layout_path: null
    tracked: false
    commit: eed3361
    edits: ["source and hashes added"]
    notes: >-
      Same contract as the exporter's copy. The example omits some batch groups (nano b3, medium b2 and
      b3).

  detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: exports/detectors/keypoint_detectors/rtmw/wholebody/rtmw-wholebody.yaml
    kind: export
    exporter_layout_path: null
    tracked: false
    commit: eed3361
    edits: ["source and hashes added"]
    notes: >-
      Drifted from the exporter's copy; replace it with the procedure. The example adds
      crop_policy.pad_value 0, refers to the shared coco133 skeleton fragments where the exporter inlines
      133 names and one edge set named wholebody, and has the overlay of skellytracker's package sidecar
      (rtmpose_skeleton, prefix groups, a face group) instead of the exporter's overlay.

  # The provenance line of this example in the single-file spec, moved here by the split:
  # Source: OpenMMLab-Exporter `notes/decisions/rtmo-body7.yaml` at commit `38ed76f` (the tracked copy of the sidecar its `rtmo-body7` family writes; header comment removed). Spec path: `detectors/keypoint_detectors/rtmo/body/rtmo-body7.yaml`. The exporter writes it to `rtmo/body7/`, which is not one of the spec's part folders.
  detectors/keypoint_detectors/rtmo/body/rtmo-body7.yaml:
    exporter: OpenMMLab-Exporter
    exporter_path: notes/decisions/rtmo-body7.yaml
    kind: export
    exporter_layout_path: exports/detectors/keypoint_detectors/rtmo/body7/rtmo-body7.yaml
    tracked: true
    commit: eed3361
    edits: ["header comment removed", "source and hashes added"]
    notes: >-
      The tracked copy was last committed at 38ed76f; the current writer (rtmo/sidecar.py at eed3361)
      writes the same contract. The exporter's exports/ copy adds fp16, batch groups 2 and 3 and sizes
      s, l and t.

proposed:
  - key: mediapipe-hand@qualcomm-exporter
    exporter: Qualcomm-Exporter
    plan: Qualcomm-Exporter/plans/hand-pose-export.md
    status: proposed
    notes: >-
      The hand landmark model has a 256 by 256 input and outputs 21 landmarks, a hand score and a
      handedness score.

  - key: mediapipe-hand-recrop@qualcomm-exporter
    exporter: Qualcomm-Exporter
    plan: Qualcomm-Exporter/plans/hand-pose-export.md
    status: proposed
    notes: >-
      The hand re-crop model is a region of interest (ROI) refiner that gives two points for a new
      crop. The spec has no section for an ROI refiner yet (a gap, see specs/model-sidecar/model-addition-workflow/rules.md).

  - key: mediapipe-hand-landmark@mediapipe-exporter
    exporter: MediaPipe-Exporter
    plan: MediaPipe-Exporter/plans/hand-pipeline-export.md
    status: proposed
    notes: >-
      The hand landmark model (sizes full and lite) has a 224 by 224 input and gives landmarks, a hand
      score, a handedness score and world landmarks.

  - key: mediapipe-hand-recrop@mediapipe-exporter
    exporter: MediaPipe-Exporter
    plan: MediaPipe-Exporter/plans/hand-pipeline-export.md
    status: proposed
    notes: >-
      The hand re-crop model is a region of interest (ROI) refiner that gives two points for a new
      crop. The spec has no section for an ROI refiner yet (a gap, see specs/model-sidecar/model-addition-workflow/rules.md).
