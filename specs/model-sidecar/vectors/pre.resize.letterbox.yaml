# Normative text: specs/model-sidecar/pre/resize-letterbox.md.
# `target_size` is [height, width]. `src_w` and `src_h` are the source size in pixels.
# `expect` gives the size of the resized image (`n_w`, `n_h`) and its position on the padded canvas
# (`left`, `top`).
# `unproject` applies the section's Inverse to one model-input position.
# A case that lists `verified_against` gave the same `expect` values with that function. The
# function does not compute `unproject`.
section: pre.resize.letterbox
spec_revision: vNEXT
generated_by: tools/make_vectors.py
unverified: "letterbox_preprocess implements only part of the section: it has no pad_position
  center, it cuts the scaled size instead of rounding it, and it fails when n_w would
  be 0. A case that lists verified_against gave the same n_w, n_h, left and top with
  that function. No independent implementation has run the other cases."
cases:
