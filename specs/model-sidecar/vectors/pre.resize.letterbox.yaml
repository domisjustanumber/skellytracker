# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.letterbox
notes:
  - "Normative text: specs/model-sidecar/pre/resize-letterbox.md."
  - "`target_size` is [height, width]. `src_w` and `src_h` are the source size in pixels."
  - "`expect` gives the size of the resized image (`n_w`, `n_h`) and its position on the
    padded canvas (`left`, `top`)."
  - "A case `<id>-inverse` applies the section's Inverse to one model-input position
    (`model_xy`) of the case `<id>`."
  - "A case that lists `verified_against` gave the same `expect` values with that
    function. The function does not compute the Inverse."
tolerance: 0.0001
unverified: "One implementation ran each case: OpenMMLab-Exporter, with a different function for
  each group of cases. Each case lists its function in verified_against. A vector is
  fully verified only when two independent implementations agree."
cases:
  - id: center-half-even-landscape
    note: "s = 1/3; the image fills the width and sits in the middle of the height"
    params: {target_size: [640, 640], pad_position: center, rounding: half_even}
    input: {src_w: 1920, src_h: 1080}
    expect: {n_w: 640, n_h: 360, left: 0, top: 140}
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::letterbox}
  - id: center-half-even-landscape-inverse
    function: inverse
    params: {target_size: [640, 640], pad_position: center, rounding: half_even}
    input: {src_w: 1920, src_h: 1080, model_xy: [320, 320]}
    expect: {source_xy: [960, 540]}
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/unprojection.py::inverse_points}
