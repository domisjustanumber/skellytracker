# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.normalize
notes:
  - "Normative text: specs/model-sidecar/pre/normalization.md. Decision:
    decisions/entries/90CE-minimal-sidecar-contract.md."
  - "`pixels_bgr` are pixels of the resized frame in BGR source order, as OpenCV delivers
    them. `values` are the same pixels in the channel order of the tensor
    (`channel_order`), one list of three numbers per pixel."
  - "`params` use the sidecar field names: `normalization`, `normalization_by_precision`,
    `color_format` and `dtype` are fields of `input`; `precision` selects the entry of
    `normalization_by_precision` (default fp32)."
tolerance: 0.00001
unverified: "The independent implementations ran only some cases. Each of these cases lists them
  in verified_against."
cases:
  - id: none-rgb
    note: "the values stay 0..255; color_format rgb swaps the BGR source channels"
    params: {normalization: none, color_format: rgb, dtype: float32}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: none
      channel_order: rgb
      values: [[0, 0, 0], [255, 255, 255], [250, 128, 10], [50, 100, 200]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: none-bgr
    params: {normalization: none, color_format: bgr, dtype: float32}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: none
      channel_order: bgr
      values: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: none-uint8
    note: "the cast to the input dtype keeps the 0..255 values"
    params: {normalization: none, color_format: rgb, dtype: uint8}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: none
      channel_order: rgb
      values: [[0, 0, 0], [255, 255, 255], [250, 128, 10], [50, 100, 200]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: unit-float-rgb
    params: {normalization: unit_float, color_format: rgb}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: unit_float
      channel_order: rgb
      values: [[0, 0, 0], [1, 1, 1], [0.980392, 0.501961, 0.039216], [0.196078, 0.392157, 0.784314]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: unit-float-bgr
    params: {normalization: unit_float, color_format: bgr}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: unit_float
      channel_order: bgr
      values: [[0, 0, 0], [1, 1, 1], [0.039216, 0.501961, 0.980392], [0.784314, 0.392157, 0.196078]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: imagenet-bgr
    note: "color_format bgr: the tensor order is B, G, R, and B uses mean 103.53 and std 57.375"
    params: {normalization: imagenet, color_format: bgr}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: imagenet
      channel_order: bgr
      values:
        - [-1.804444, -2.035714, -2.117904]
        - [2.64, 2.428571, 2.248908]
        - [-1.630153, 0.205182, 2.163285]
        - [1.681394, -0.285014, -1.261666]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: imagenet-rgb
    note: "color_format rgb: the tensor order is R, G, B, and R uses mean 123.675 and std 58.395"
    params: {normalization: imagenet, color_format: rgb}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: imagenet
      channel_order: rgb
      values:
        - [-2.117904, -2.035714, -1.804444]
        - [2.248908, 2.428571, 2.64]
        - [2.163285, 0.205182, -1.630153]
        - [-1.261666, -0.285014, 1.681394]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: custom-rgb
    note: "(pixel * scale - mean) / std; mean and std are in the rgb order of input.color_format"
    params:
      normalization:
        mode: custom
        scale: 0.00392156862745098
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
      color_format: rgb
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: custom
      channel_order: rgb
      values:
        - [-2.117904, -2.035714, -1.804444]
        - [2.248908, 2.428571, 2.64]
        - [2.163285, 0.205182, -1.630153]
        - [-1.261666, -0.285014, 1.681394]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: custom-bgr
    note: "the same statistics in bgr order give the custom-rgb values in reverse order"
    params:
      normalization:
        mode: custom
        scale: 0.00392156862745098
        mean: [0.406, 0.456, 0.485]
        std: [0.225, 0.224, 0.229]
      color_format: bgr
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: custom
      channel_order: bgr
      values:
        - [-1.804444, -2.035714, -2.117904]
        - [2.64, 2.428571, 2.248908]
        - [-1.630153, 0.205182, 2.163285]
        - [1.681394, -0.285014, -1.261666]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: custom-scale-defaults-to-one
    note: "scale is absent: it is 1. The order is the bgr of input.color_format"
    params: {normalization: {mode: custom, mean: [1, 2, 3], std: [2, 2, 2]}, color_format: bgr}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: custom
      channel_order: bgr
      values: [[-0.5, -1, -1.5], [127, 126.5, 126], [4.5, 63, 123.5], [99.5, 49, 23.5]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: color-format-is-required
    note: "input.color_format is absent, and there is no default. The sidecar shows only its
      input block. The case checks only the rules of this section."
    function: none
    params: {}
    input: {sidecar: {input: {name: input, dtype: {fp32: float32}, normalization: imagenet}}}
    expect: {failed: [V-pre.normalize-1]}
  - id: custom-has-no-color-format
    note: "a custom object holds only mode, scale, mean and std. It uses input.color_format.
      The sidecar shows only its input block. The case checks only the rules of this
      section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          color_format: rgb
          normalization: {mode: custom, color_format: bgr, mean: [0, 0, 0], std: [1, 1, 1]}
    expect: {failed: [V-pre.normalize-1]}
  - id: normalization-is-required
    note: "input.normalization is absent, and there is no default. The sidecar shows only its
      input block. The case checks only the rules of this section."
    function: none
    params: {}
    input: {sidecar: {input: {name: input, dtype: {fp32: float32}, color_format: bgr}}}
    expect: {failed: [V-pre.normalize-1]}
  - id: precision-override
    note: "normalization_by_precision wins over the top-level normalization"
    params:
      normalization: unit_float
      normalization_by_precision: {fp16: none}
      precision: fp16
      color_format: rgb
      dtype: uint8
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: none
      channel_order: rgb
      values: [[0, 0, 0], [255, 255, 255], [250, 128, 10], [50, 100, 200]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
  - id: precision-without-override
    note: "no entry for fp32: the top-level normalization applies"
    params:
      normalization: unit_float
      normalization_by_precision: {fp16: none}
      precision: fp32
      color_format: rgb
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: unit_float
      channel_order: rgb
      values: [[0, 0, 0], [1, 1, 1], [0.980392, 0.501961, 0.039216], [0.196078, 0.392157, 0.784314]]
    verified_against:
      - {OpenMMLab-Exporter: onnx_runtime/preprocess.py::make_normalizer}
