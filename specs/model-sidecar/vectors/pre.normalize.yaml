# Test vectors for the section `pre.normalize`.
# Generated by tools/make_vectors.py. Do not edit this file by hand.
# A case with fractional numbers gives a `tolerance`. Compare each fractional number
# with an absolute difference of at most this value. Integers must match exactly.
# Normative text: specs/model-sidecar/pre/normalization.md. Decision:
# notes/decisions/0009-imagenet-bgr-meaning.md.
# `pixels_bgr` are pixels of the resized frame in BGR source order, as OpenCV delivers them.
# `values` are the same pixels in the channel order of the tensor (`channel_order`), one list of
# three numbers per pixel.
# `params` use the sidecar field names: `normalization`, `normalization_by_precision`,
# `color_format` and `dtype` are fields of `input`; `precision` selects the entry of
# `normalization_by_precision` (default fp32).
# The meaning of `imagenet_bgr` depends on `schema_version`: a case with `schema_version: "< vNEXT"`
# uses the legacy meaning.
section: pre.normalize
spec_revision: vNEXT
generated_by: tools/make_vectors.py
unverified: "No independent implementation has run these vectors yet. They come from the section
  text only."
cases:
  - id: none-rgb  # the values stay 0..255; color_format rgb swaps the BGR source channels
    params: {normalization: none, color_format: rgb, dtype: float32}
    input: {pixels_bgr: [[0, 0, 0], [255, 255, 255], [10, 128, 250], [200, 100, 50]]}
    expect:
      resolved_mode: none
      channel_order: rgb
      values: [[0, 0, 0], [255, 255, 255], [250, 128, 10], [50, 100, 200]]
  - id: none-bgr
