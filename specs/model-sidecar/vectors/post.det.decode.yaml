section: post.det.decode
notes:
  - "Normative text: specs/model-sidecar/post/detection-decode.md. Decision:
    decisions/entries/17KN-one-selection-pipeline.md."
  - "Each case is a data-only validator case (`function: none`): `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails. The
    `post.det.selection.*` files hold the cases of the decode steps."
tolerance: 0.00001
unverified: "No validator has run these cases yet. They come from the section text only."
cases:
