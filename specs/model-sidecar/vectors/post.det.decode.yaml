    note: "decode.min_box_size is -1. A size must be 0 or more. The sidecar shows only its
      outputs and decode blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        outputs:
          - {name: boxes, dtype: {fp32: float32}, shape: [-1, -1, 4], semantic: boxes}
          - {name: scores, dtype: {fp32: float32}, shape: [-1, -1], semantic: scores}
        decode:
          selection: nms
          boxes_output: boxes
          scores_output: scores
          box_format: xyxy
          box_scale: pixel
          is_person_only: true
          min_box_size: -1
          nms: {iou_threshold: 0.6, score_threshold: 0.05}
    expect: {failed: [V-post.det.decode-8]}
