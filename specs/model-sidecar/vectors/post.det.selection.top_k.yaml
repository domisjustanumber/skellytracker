# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: post.det.selection.top_k
notes:
  - "Normative text: specs/model-sidecar/post/selection-top-k.md and
    specs/model-sidecar/post/detection-decode.md."
  - "`params` use the names of the `decode` fields. `kept_rows` are 0-based row indexes
    of the input, `scores` and `class_ids` are the scores and the emitted class ids of
    the kept detections, in output order."
  - "The cases stop before the unprojection, the clamp and the size filter. `boxes_xyxy`
    holds the kept boxes in model-input pixels. Every score and threshold gives the same
    result in float32 and in float64."
  - "`class_logits` is [Q, C] (rows, classes). `boxes` is [Q, 4]. A selected pair is a
    (row, class); one row can be selected for several classes."
tolerance: 0.00001
checks: [float32-stable]
unverified: "No independent implementation has run these vectors yet. They come from the section
  text only. skellytracker has no code for this section."
cases:
  - id: several-classes-on-one-row
    note: "the top 3 pairs are (2, 1), (0, 0) and (0, 1): row 0 is selected twice, with two classes"
    params: {top_k: 3, confidence_threshold_default: 0.25}
    input:
      boxes: [[0, 0, 8, 8], [10, 0, 18, 8], [20, 0, 28, 8]]
      class_logits: [[0.9, 0.8, 0.1], [0.2, 0.3, 0.1], [0.4, 0.95, 0.05]]
    expect:
      kept_rows: [2, 0, 0]
      scores: [0.95, 0.9, 0.8]
      class_ids: [1, 0, 1]
      boxes_xyxy: [[20, 0, 28, 8], [0, 0, 8, 8], [0, 0, 8, 8]]
  - id: ties-keep-the-lower-flat-index
    note: "all scores are equal: flat indexes 0, 1, 2 are selected (rows 0, 0, 1)"
    params: {top_k: 3, confidence_threshold_default: 0.25}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.5, 0.5], [0.5, 0.5]]}
    expect:
      kept_rows: [0, 0, 1]
      scores: [0.5, 0.5, 0.5]
      class_ids: [0, 1, 0]
      boxes_xyxy: [[0, 0, 8, 8], [0, 0, 8, 8], [10, 0, 18, 8]]
  - id: top-k-larger-than-the-candidates
    note: "min(top_k, Q * C) = 4 pairs are selected"
    params: {top_k: 10, confidence_threshold_default: 0.25}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.75, 0.5], [0.625, 0.875]]}
    expect:
      kept_rows: [1, 0, 1, 0]
      scores: [0.875, 0.75, 0.625, 0.5]
      class_ids: [1, 0, 0, 1]
      boxes_xyxy: [[10, 0, 18, 8], [0, 0, 8, 8], [10, 0, 18, 8], [0, 0, 8, 8]]
  - id: class-id-map-lowers-the-count
    note: "the top 3 pairs are (0, 0), (0, 1), (1, 0); class 0 maps to -1; pair (1, 1) does not
      take their place"
    params:
      top_k: 3
      class_id_map: [-1, 7]
      person_class_id: 7
      confidence_threshold_default: 0.25
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.9, 0.8], [0.7, 0.6]]}
    expect: {kept_rows: [0], scores: [0.8], class_ids: [7], boxes_xyxy: [[0, 0, 8, 8]]}
  - id: top-k-limit-comes-before-the-confidence-filter
    note: "the top 2 pairs have scores 0.9 and 0.8; 0.8 is dropped; 0.7 does not take its place"
    params: {top_k: 2, confidence_threshold_default: 0.85}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.9, 0.8], [0.7, 0.6]]}
    expect: {kept_rows: [0], scores: [0.9], class_ids: [0], boxes_xyxy: [[0, 0, 8, 8]]}
  - id: sigmoid-and-strict-threshold
    note: "sigmoid(0) = 0.5 is not above the threshold 0.5; the kept scores are sigmoid values"
    params: {top_k: 4, score_activation: sigmoid, confidence_threshold_default: 0.5}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0, 2], [-2, 4]]}
    expect:
      kept_rows: [1, 0]
      scores: [0.982014, 0.880797]
      class_ids: [1, 1]
      boxes_xyxy: [[10, 0, 18, 8], [0, 0, 8, 8]]
  - id: default-confidence-threshold
    note: "confidence_threshold_default is absent: the default is 0.7; 0.75 stays and 0.65 is
      dropped"
    params: {top_k: 4}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.9, 0.65], [0.75, 0.5]]}
    expect:
      kept_rows: [0, 1]
      scores: [0.9, 0.75]
      class_ids: [0, 0]
      boxes_xyxy: [[0, 0, 8, 8], [10, 0, 18, 8]]
  - id: is-person-only
    note: "only class 0 stays: pairs (0, 0) and (1, 0)"
    params: {top_k: 4, is_person_only: true, person_class_id: 0, confidence_threshold_default: 0.25}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.9, 0.8], [0.7, 0.6]]}
    expect:
      kept_rows: [0, 1]
      scores: [0.9, 0.7]
      class_ids: [0, 0]
      boxes_xyxy: [[0, 0, 8, 8], [10, 0, 18, 8]]
  - id: class-id-base
    note: "emitted class id = class_id_base + model class index"
    params: {top_k: 2, class_id_base: 5, person_class_id: 5, confidence_threshold_default: 0.25}
    input: {boxes: [[0, 0, 8, 8], [10, 0, 18, 8]], class_logits: [[0.9, 0.8], [0.7, 0.6]]}
    expect:
      kept_rows: [0, 0]
      scores: [0.9, 0.8]
      class_ids: [5, 6]
      boxes_xyxy: [[0, 0, 8, 8], [0, 0, 8, 8]]
