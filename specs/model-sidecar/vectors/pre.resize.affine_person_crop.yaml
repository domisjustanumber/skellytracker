# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.affine_person_crop
notes:
  - "Normative text: specs/model-sidecar/pre/resize-affine-person-crop.md."
  - "`target_size` is [height, width]. `bbox_xyxy` is the person box [x1, y1, x2, y2] in
    source pixels. The rotation is 0."
  - "The `expect` of a numeric case gives the centre of the crop, its size (`crop_w`,
    `crop_h`) after the expansion and the aspect-ratio step, and the warp matrix M that
    maps source pixels to model-input pixels."
  - "A case with `function: none` is a data-only validator case: `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails."
  - "A case `<id>-inverse` applies the section's Inverse to one model-input position
    (`model_xy`) of the case `<id>`."
tolerance: 0.0001
unverified: "No independent implementation has run these vectors yet. They come from the section
  text only."
cases:
  - id: tall-box-grows-width
    note: "box 200x400, expanded to 250x500; 250 < 500 * 0.75, so w = 375. The centre maps to
      the centre of the target"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [100, 50, 300, 450]}
    expect:
      center: [200, 250]
      crop_w: 375
      crop_h: 500
      matrix: [[0.512, 0, -6.4], [0, 0.512, 0]]
  - id: tall-box-grows-width-inverse
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [100, 50, 300, 450], model_xy: [96, 128]}
    expect: {source_xy: [200, 250]}
  - id: wide-box-grows-height
    note: "box 400x200, expanded to 500x250; 500 > 250 * 0.75, so h = 500 * 256 / 192. The
      top-left corner of the target maps to the top-left corner of the crop"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [0, 0, 400, 200]}
    expect:
      center: [200, 100]
      crop_w: 500
      crop_h: 666.666667
      matrix: [[0.384, 0, 19.2], [0, 0.384, 89.6]]
  - id: wide-box-grows-height-inverse
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [0, 0, 400, 200], model_xy: [0, 0]}
    expect: {source_xy: [-50, -233.333333]}
  - id: no-expansion
    note: "expand_ratio 1.0: w = 100 grows to 150 to match the aspect ratio 192 / 256"
    params: {target_size: [256, 192], expand_ratio: 1, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [10, 20, 110, 220]}
    expect:
      center: [60, 120]
      crop_w: 150
      crop_h: 200
      matrix: [[1.28, 0, 19.2], [0, 1.28, -25.6]]
  - id: no-expansion-inverse
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [10, 20, 110, 220], model_xy: [192, 256]}
    expect: {source_xy: [135, 220]}
  - id: aspect-ratio-not-kept
    note: "maintain_aspect_ratio false: the box is warped as it is, so the x and y scales differ"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: false}
    input: {bbox_xyxy: [100, 50, 300, 450]}
    expect:
      center: [200, 250]
      crop_w: 250
      crop_h: 500
      matrix: [[0.768, 0, -57.6], [0, 0.512, 0]]
  - id: aspect-ratio-not-kept-inverse
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: false}
    input: {bbox_xyxy: [100, 50, 300, 450], model_xy: [192, 256]}
    expect: {source_xy: [325, 500]}
  - id: box-outside-the-image
    note: "the crop can reach outside the source image"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [-50, -20, 150, 380]}
    expect:
      center: [50, 180]
      crop_w: 375
      crop_h: 500
      matrix: [[0.512, 0, 70.4], [0, 0.512, 35.84]]
  - id: box-outside-the-image-inverse
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [-50, -20, 150, 380], model_xy: [96, 128]}
    expect: {source_xy: [50, 180]}
  - id: square-target
    note: "a square box in a square target: w = h = 125"
    params: {target_size: [288, 288], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [0, 0, 100, 100]}
    expect:
      center: [50, 50]
      crop_w: 125
      crop_h: 125
      matrix: [[2.304, 0, 28.8], [0, 2.304, 28.8]]
  - id: square-target-inverse
    function: inverse
    params: {target_size: [288, 288], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [0, 0, 100, 100], model_xy: [288, 288]}
    expect: {source_xy: [112.5, 112.5]}
  - id: target-384x288
    note: "target_size [384, 288] is 288 wide and 384 high: w = 625 * 288 / 384 = 468.75. The
      target centre maps to the centre of the box"
    params: {target_size: [384, 288], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [320, 100, 520, 600]}
    expect:
      center: [420, 350]
      crop_w: 468.75
      crop_h: 625
      matrix: [[0.6144, 0, -114.048], [0, 0.6144, -23.04]]
  - id: target-384x288-inverse
    function: inverse
    params: {target_size: [384, 288], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {bbox_xyxy: [320, 100, 520, 600], model_xy: [144, 192]}
    expect: {source_xy: [420, 350]}
  - id: affine-crop-needs-target-size
    note: "the size declares no input.resize.target_size. The sidecar shows only its input and
      sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: affine_person_crop, interpolation: linear}
        sizes: {m: {input: {shape: [-1, 3, 256, 192]}}}
    expect: {failed: [V-pre.resize.affine_person_crop-3]}
  - id: affine-crop-has-no-pad-position
    note: "an affine_person_crop resize does not letterbox, so input.resize.pad_position is not
      allowed. The sidecar shows only its input and sizes blocks. The case checks only the
      rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: affine_person_crop, interpolation: linear, pad_position: center}
        sizes: {m: {input: {shape: [-1, 3, 256, 192], resize: {target_size: [256, 192]}}}}
    expect: {failed: [V-pre.resize.affine_person_crop-3]}
