# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.fit
notes:
  - "Normative text: specs/model-sidecar/pre/resize-fit.md. Decision:
    notes/decisions/0012-fit-resize-for-rtmo.md."
  - "`target_size` is [height, width]. `expect` gives the scale and the fractional
    offsets of the warp matrix M = [[scale, 0, left], [0, scale, top]]. The geometry
    does not depend on `pad_value`."
  - "A case `<id>-inverse` applies the section's Inverse to one model-input position
    (`model_xy`) of the case `<id>`."
  - "`fit_preprocess` does not compute the Inverse. Its warp matrix, inverted, gave the
    same `source_xy` for each `-inverse` case."
  - "A case with `function: border` gives `border`, the value of a pixel in the padding,
    one value for each channel. Pixel (0, 0) is in the padding of each such case."
tolerance: 0.0001
unverified: "fit_preprocess gives [114, 0, 0] for the case scalar-pad-fills-each-channel, because
  it passes a scalar pad_value unchanged to cv2.warpAffine. Each other case lists
  verified_against: that function gave the same expect values."
cases:
  - id: landscape-into-square
    note: "s = 1/3; top = (640 - 360) / 2 = 140"
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {scale: 0.333333, left: 0, top: 140}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: landscape-into-square-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [320, 320]}
    expect: {source_xy: [960, 540]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: unproject-in-the-padding
    note: "a position in the padding maps outside the source: y_src = -420"
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {scale: 0.333333, left: 0, top: 140}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: unproject-in-the-padding-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [0, 0]}
    expect: {source_xy: [0, -420]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: portrait-into-square
    note: "the padding is on the left and right: left = 140"
    params: {target_size: [640, 640]}
    input: {src_w: 1080, src_h: 1920}
    expect: {scale: 0.333333, left: 140, top: 0}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: portrait-into-square-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1080, src_h: 1920, model_xy: [320, 320]}
    expect: {source_xy: [540, 960]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: fractional-offset
    note: "s = 0.64; top = 213.44. A letterbox gives n_h = 213 and top = 213 here"
    params: {target_size: [640, 640]}
    input: {src_w: 1000, src_h: 333}
    expect: {scale: 0.64, left: 0, top: 213.44}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: fractional-offset-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1000, src_h: 333, model_xy: [320, 320]}
    expect: {source_xy: [500, 166.5]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: half-pixel-offset-scale-one
    note: "s = 1; top = 80.5 (a letterbox with center gives top = 80)"
    params: {target_size: [640, 640]}
    input: {src_w: 640, src_h: 479}
    expect: {scale: 1, left: 0, top: 80.5}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: half-pixel-offset-scale-one-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 640, src_h: 479, model_xy: [100, 80.5]}
    expect: {source_xy: [100, 0]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: scale-exactly-one
    note: "no padding: the unprojection is the identity"
    params: {target_size: [640, 640]}
    input: {src_w: 640, src_h: 640}
    expect: {scale: 1, left: 0, top: 0}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: scale-exactly-one-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 640, src_h: 640, model_xy: [123.5, 456.25]}
    expect: {source_xy: [123.5, 456.25]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: upscale
    note: "s = 2; top = 80"
    params: {target_size: [640, 640]}
    input: {src_w: 320, src_h: 240}
    expect: {scale: 2, left: 0, top: 80}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: upscale-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 320, src_h: 240, model_xy: [320, 80]}
    expect: {source_xy: [160, 0]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: one-pixel-wide-source
    note: "s = 6.4; left = 316.8 (a letterbox with center gives n_w = 6 and left = 317)"
    params: {target_size: [640, 640]}
    input: {src_w: 1, src_h: 100}
    expect: {scale: 6.4, left: 316.8, top: 0}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: one-pixel-wide-source-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1, src_h: 100, model_xy: [320, 0]}
    expect: {source_xy: [0.5, 0]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: non-square-target
    note: "target_size [384, 640] is 640 wide and 384 high: s = 1/3 and top = 12"
    params: {target_size: [384, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {scale: 0.333333, left: 0, top: 12}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: non-square-target-inverse
    function: inverse
    params: {target_size: [384, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [320, 192]}
    expect: {source_xy: [960, 540]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: limited-by-height
    note: "the height limits s: s = 100 / 1080 and left = 231.111111"
    params: {target_size: [100, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {scale: 0.092593, left: 231.111111, top: 0}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: limited-by-height-inverse
    function: inverse
    params: {target_size: [100, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [320, 50]}
    expect: {source_xy: [960, 540]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: float-noise-below-integer
    note: "src_w * s = 415.99999999999994 in float64: left is 0 within the tolerance"
    params: {target_size: [416, 416]}
    input: {src_w: 1440, src_h: 1080}
    expect: {scale: 0.288889, left: 0, top: 52}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: float-noise-below-integer-inverse
    function: inverse
    params: {target_size: [416, 416]}
    input: {src_w: 1440, src_h: 1080, model_xy: [208, 208]}
    expect: {source_xy: [720, 540]}
    verified_against:
      - skellytracker/core/detectors/processing/image_preprocessing.py::fit_preprocess
  - id: scalar-pad-fills-each-channel
    note: "a scalar pad_value s gives [s, s, s]. A scalar borderValue of OpenCV fills only
      channel 0 and gives [114, 0, 0]. Pixel (0, 0) maps to y_src = -420"
    function: border
    checks: [pixel-0-0-outside-source]
    params: {target_size: [640, 640], pad_value: 114}
    input: {src_w: 1920, src_h: 1080}
    expect: {border: [114, 114, 114]}
