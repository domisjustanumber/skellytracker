            - class69
            - class70
            - class71
            - class72
            - class73
            - class74
            - class75
            - class76
            - class77
            - class78
          decode:
            selection: nms
            boxes_output: boxes
            class_logits_output: logits
            box_format: xyxy
            nms: {iou_threshold: 0.6, score_threshold: 0.05}
            box_space: pixel
    expect: {failed: [V-post.object.selection.nms-1]}
