# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.none
notes:
  - "Normative text: specs/model-sidecar/pre/resize-none.md."
  - "Each case is a data-only validator case (`function: none`): `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails."
tolerance: 0.0001
unverified: "No validator has run these cases yet. They come from the section text only."
cases:
  - id: none-has-no-target-size
    note: "a none resize passes the source image unchanged, so the size must omit
      input.resize.target_size. The sidecar shows only its input and sizes blocks. The
      case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input: {name: input, dtype: {fp32: float32}, resize: {method: none}}
        sizes: {nano: {input: {shape: [-1, 3, 480, 640], resize: {target_size: [480, 640]}}}}
    expect: {failed: [V-pre.resize.none-1]}
  - id: none-has-no-rounding
    note: "a none resize does not letterbox, so input.resize.rounding is not allowed. The
      sidecar shows only its input and sizes blocks. The case checks only the rules of
      this section."
    function: none
    params: {}
    input:
      sidecar:
        input: {name: input, dtype: {fp32: float32}, resize: {method: none, rounding: half_even}}
        sizes: {nano: {input: {shape: [-1, 3, 480, 640]}}}
    expect: {failed: [V-pre.resize.none-1]}
