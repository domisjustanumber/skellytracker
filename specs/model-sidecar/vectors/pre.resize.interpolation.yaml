    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear, compute_dtype: float32}
        sizes: {nano: {input: {shape: [-1, 3, 560, 560], resize: {target_size: [560, 560]}}}}
    expect: {failed: []}
