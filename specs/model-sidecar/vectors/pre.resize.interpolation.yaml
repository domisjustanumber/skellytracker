    note: "compute_dtype has only the values uint8 and float32. The sidecar shows only its
      input and sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear, compute_dtype: float16}
        sizes: {nano: {input: {shape: [-1, 3, 560, 560], resize: {target_size: [560, 560]}}}}
