# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.interpolation
notes:
  - "Normative text: specs/model-sidecar/pre/interpolation.md."
  - "Each validator case is a data-only case (`function: none`): `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails."
  - "The cases of check_resize compare the resize result of a host (`input.result`) with
    the reference result (`input.reference`), as heading Resize limit gives. Each image
    is a small HWC array. `params.resize` is the `input.resize` block. Only its
    `compute_dtype` is read."
  - "These cases are not pixel cases: `expect` is the largest difference and a boolean. A
    host runs them through its own check of the limit. The check converts both results
    to float64 and compares the absolute difference of each value with the limit."
tolerance: 0.0001
unverified: "The independent implementations ran only some cases. Each of these cases lists them
  in verified_against."
cases:
  - id: compute-dtype-float32-is-valid
    note: "a stretch resize can resize in float32. The sidecar shows only its input and sizes
      blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear, compute_dtype: float32}
        sizes: {nano: {input: {shape: [-1, 3, 560, 560], resize: {target_size: [560, 560]}}}}
    expect: {failed: []}
    verified_against:
      - skellytracker/core/model_spec/rules.py::check_sidecar
  - id: compute-dtype-float16-is-not-a-value
    note: "compute_dtype has only the values uint8 and float32. The sidecar shows only its
      input and sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear, compute_dtype: float16}
        sizes: {nano: {input: {shape: [-1, 3, 560, 560], resize: {target_size: [560, 560]}}}}
    expect: {failed: [V-pre.resize.interpolation-1]}
    verified_against:
      - skellytracker/core/model_spec/rules.py::check_sidecar
  - id: fractional-pad-with-an-8-bit-resize-is-refused
    note: "compute_dtype is absent, so the resize is uint8. The pad 114.5 has no 8-bit value.
      The sidecar shows only its input and sizes blocks. The case checks only the rules of
      this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: letterbox, interpolation: linear, pad_value: 114.5}
        sizes: {nano: {input: {shape: [-1, 3, 640, 640], resize: {target_size: [640, 640]}}}}
    expect: {failed: [V-pre.resize.interpolation-2]}
    verified_against:
      - skellytracker/core/model_spec/rules.py::check_sidecar
  - id: fractional-pad-with-a-float32-resize-is-valid
    note: "a float32 resize pads in float32, so the pad 114.5 is valid. The sidecar shows only
      its input and sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize:
            method: letterbox
            interpolation: linear
            compute_dtype: float32
            pad_value: 114.5
        sizes: {nano: {input: {shape: [-1, 3, 640, 640], resize: {target_size: [640, 640]}}}}
    expect: {failed: []}
    verified_against:
      - skellytracker/core/model_spec/rules.py::check_sidecar
  - id: limit-uint8-equal-results
    note: "compute_dtype is absent, so the limit is 1 step of uint8. The case checks only the
      resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {}}
    input: {reference: [[[0, 114, 255], [7, 8, 9]]], result: [[[0, 114, 255], [7, 8, 9]]]}
    expect: {max_difference: 0, within_limit: true}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-uint8-tie-rounded-half-to-even
    note: "the filter gives 0.5 at the first value. OpenCV rounds the tie up to 1. A Round node
      rounds it half to even, to 0. The difference is 1, so the result is in the limit.
      The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: uint8}}
    input: {reference: [[[1, 2, 3], [4, 5, 6]]], result: [[[0, 2, 3], [4, 5, 6]]]}
    expect: {max_difference: 1, within_limit: true}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-uint8-two-steps
    note: "a difference of 2 steps is not in the limit. The case checks only the resize limit.
      It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: uint8}}
    input: {reference: [[[100, 100, 100]]], result: [[[102, 100, 99]]]}
    expect: {max_difference: 2, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-uint8-fractional-value
    note: "a uint8 result has only integer values. The value 0.5 differs by less than 1, but it
      is not an 8-bit value. The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: uint8}}
    input: {reference: [[[0, 0, 0]]], result: [[[0.5, 0, 0]]]}
    expect: {max_difference: 0.5, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-uint8-value-above-255
    note: "a uint8 result has values from 0 to 255. The value 256 differs by 1, but it is not
      an 8-bit value. The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: uint8}}
    input: {reference: [[[255, 255, 255]]], result: [[[256, 255, 255]]]}
    expect: {max_difference: 1, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-in-limit
    note: "with float32, the limit is 0.05 on the 0-255 scale. A difference of 0.046875 is in
      the limit. The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[0.5, 114, 254.25]]], result: [[[0.546875, 114, 254.21875]]]}
    expect: {max_difference: 0.046875, within_limit: true}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-over-the-limit
    note: "a difference of 0.0625 is not in the limit 0.05. The case checks only the resize
      limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[10, 20, 30]]], result: [[[10.0625, 20, 30]]]}
    expect: {max_difference: 0.0625, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-float32-of-0.05-is-over-the-limit
    note: "the check converts both results to float64. float32(0.05) is 0.05000000074505806 in
      float64, so it is over the limit 0.05 against 0. expect writes the difference with 6
      decimals. The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[0, 20, 30]]], result: [[[0.05, 20, 30]]]}
    expect: {max_difference: 0.05, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-one-uint8-step-is-over-the-limit
    note: "a difference of 1 is in the uint8 limit, but not in the float32 limit. The case
      checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[10.5, 20, 30]]], result: [[[11.5, 20, 30]]]}
    expect: {max_difference: 1, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-cubic-values-outside-0-255
    note: "a float32 cubic resize is not clamped, so values below 0 and above 255 are valid.
      The case checks only the resize limit. It checks no V- rule."
    function: check_resize
    params: {resize: {interpolation: cubic, compute_dtype: float32}}
    input: {reference: [[[-3.5, 260.25, 128]]], result: [[[-3.46875, 260.25, 128]]]}
    expect: {max_difference: 0.03125, within_limit: true}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-nan-value
    note: "a NaN value is not in the limit. The case checks only the resize limit. It checks no
      V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[10, 20, 30]]], result: [[[.nan, 20, 30]]]}
    expect: {max_difference: .nan, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-float32-infinite-value
    note: "an infinite value is not in the limit. The case checks only the resize limit. It
      checks no V- rule."
    function: check_resize
    params: {resize: {compute_dtype: float32}}
    input: {reference: [[[10, 20, 30]]], result: [[[.inf, 20, 30]]]}
    expect: {max_difference: .inf, within_limit: false}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
  - id: limit-shape-is-not-the-reference-shape
    note: "the input is an image, not a sidecar value. A result with 2 pixels cannot agree with
      a reference result with 1 pixel."
    function: check_resize
    checks: [refused]
    params: {resize: {compute_dtype: uint8}}
    input: {reference: [[[1, 2, 3]]], result: [[[1, 2, 3], [1, 2, 3]]]}
    expect: {error: no-rule}
    verified_against:
      - skellytracker/core/detectors/processing/pre/resize_interpolation.py::within_resize_limit
