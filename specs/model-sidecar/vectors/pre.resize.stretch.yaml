# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.stretch
notes:
  - "Normative text: specs/model-sidecar/pre/resize-stretch.md."
  - "`target_size` is [height, width]. The `expect` of a numeric case gives the size of
    the output image (`dst_w`, `dst_h`) and the scale factor of each axis."
  - "A case with `function: none` is a data-only validator case: `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails."
  - "A case `<id>-inverse` applies the section's Inverse to one model-input position
    (`model_xy`) of the case `<id>`."
tolerance: 0.0001
unverified: "No independent implementation has run these vectors yet. They come from the section
  text only."
cases:
  - id: landscape-to-square
    note: "the x and y scale factors differ: 1/3 and 16/27"
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {dst_w: 640, dst_h: 640, scale_x: 0.333333, scale_y: 0.592593}
  - id: landscape-to-square-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [320, 320]}
    expect: {source_xy: [960, 540]}
  - id: unproject-fractional
    note: "y_src = 100 * 1080 / 640 = 168.75"
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080}
    expect: {dst_w: 640, dst_h: 640, scale_x: 0.333333, scale_y: 0.592593}
  - id: unproject-fractional-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1920, src_h: 1080, model_xy: [100, 100]}
    expect: {source_xy: [300, 168.75]}
  - id: portrait-target
    note: "target_size [640, 384] is 384 wide and 640 high: the output size is (T_w, T_h)"
    params: {target_size: [640, 384]}
    input: {src_w: 1920, src_h: 1080}
    expect: {dst_w: 384, dst_h: 640, scale_x: 0.2, scale_y: 0.592593}
  - id: portrait-target-inverse
    function: inverse
    params: {target_size: [640, 384]}
    input: {src_w: 1920, src_h: 1080, model_xy: [384, 640]}
    expect: {source_xy: [1920, 1080]}
  - id: same-size
    note: "scale 1 on both axes"
    params: {target_size: [480, 640]}
    input: {src_w: 640, src_h: 480}
    expect: {dst_w: 640, dst_h: 480, scale_x: 1, scale_y: 1}
  - id: same-size-inverse
    function: inverse
    params: {target_size: [480, 640]}
    input: {src_w: 640, src_h: 480, model_xy: [123.5, 77.25]}
    expect: {source_xy: [123.5, 77.25]}
  - id: upscale
    note: "scale 2 on both axes"
    params: {target_size: [480, 640]}
    input: {src_w: 320, src_h: 240}
    expect: {dst_w: 640, dst_h: 480, scale_x: 2, scale_y: 2}
  - id: upscale-inverse
    function: inverse
    params: {target_size: [480, 640]}
    input: {src_w: 320, src_h: 240, model_xy: [640, 480]}
    expect: {source_xy: [320, 240]}
  - id: one-pixel-wide-source
    note: "scale_x = 640; the right edge of the model input maps to x_src = 1"
    params: {target_size: [640, 640]}
    input: {src_w: 1, src_h: 100}
    expect: {dst_w: 640, dst_h: 640, scale_x: 640, scale_y: 6.4}
  - id: one-pixel-wide-source-inverse
    function: inverse
    params: {target_size: [640, 640]}
    input: {src_w: 1, src_h: 100, model_xy: [640, 320]}
    expect: {source_xy: [1, 50]}
  - id: stretch-needs-target-size
    note: "the size declares no input.resize.target_size. The sidecar shows only its input and
      sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear}
        sizes: {nano: {input: {shape: [-1, 3, 384, 384]}}}
    expect: {failed: [V-pre.resize.stretch-1]}
  - id: stretch-has-no-pad-value
    note: "a stretch resize does not pad, so input.resize.pad_value is not allowed. The sidecar
      shows only its input and sizes blocks. The case checks only the rules of this
      section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: stretch, interpolation: linear, pad_value: 114}
        sizes: {nano: {input: {shape: [-1, 3, 384, 384], resize: {target_size: [384, 384]}}}}
    expect: {failed: [V-pre.resize.stretch-1]}
