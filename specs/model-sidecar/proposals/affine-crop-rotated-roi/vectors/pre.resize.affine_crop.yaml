# tools/make_vectors.py writes `expect`. Edit the other keys, then run it.
# Hosts ignore `checks`. The names are the self-checks of the generator.
section: pre.resize.affine_crop
notes:
  - "Normative text: specs/model-sidecar/pre/resize-affine-crop.md."
  - "`target_size` is [height, width]. `roi` is the ROI [c_x, c_y, w, h, rotation] in
    source pixels, with the rotation in radians. `bbox_xyxy` is a box [x1, y1, x2, y2]
    in source pixels: the box gives the ROI with rotation 0. A case gives `roi` or
    `bbox_xyxy`."
  - "The `expect` of a numeric case gives the centre of the crop, its size (`crop_w`
    along the ROI x axis, `crop_h` along the ROI y axis) after the expansion and the
    aspect-ratio step, and the warp matrix M that maps source pixels to model-input
    pixels."
  - "A case with `function: none` is a data-only validator case: `input.sidecar` is the
    sidecar, and `expect.failed` lists the rules of this section that it fails."
  - "A case `<id>-inverse` applies the section's Inverse to one model-input position
    (`model_xy`) of the case `<id>`."
tolerance: 0.0001
unverified: "No host implementation of a rotated ROI exists. The OpenMMLab-Exporter host
  implements only rotation 0. The case roi-rotation-0-equals-box gives the values of
  the current case tall-box-grows-width."
cases:
  - id: roi-rotation-0-equals-box
    note: "the ROI of the box [100, 50, 300, 450] of tall-box-grows-width, with rotation 0. The
      expect equals the expect of tall-box-grows-width"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [200, 250, 200, 400, 0]}
    expect:
      center: [200, 250]
      crop_w: 375
      crop_h: 500
      matrix: [[0.512, 0, -6.4], [0, 0.512, 0]]
  - id: roi-quarter-turn
    note: "the ROI of roi-rotation-0-equals-box, turned by pi/2 (clockwise in the image). The
      ROI x axis points down the image. The aspect step is the same: w = 375 and h = 500
      along the ROI axes"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [200, 250, 200, 400, 1.5707963267948966]}
    expect:
      center: [200, 250]
      crop_w: 375
      crop_h: 500
      matrix: [[0, 0.512, -32], [-0.512, 0, 230.4]]
  - id: roi-quarter-turn-inverse
    note: "the middle of the right edge of the model input maps to c + (w / 2) * (cos r, sin r)
      = (200, 437.5)"
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [200, 250, 200, 400, 1.5707963267948966], model_xy: [192, 128]}
    expect: {source_xy: [200, 437.5]}
  - id: roi-negative-rotation
    note: "a wide ROI turned by -pi/6 (counterclockwise in the image). 500 > 250 * 0.75, so h =
      w / a along the ROI y axis. M uses w only"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [640, 360, 400, 200, -0.5235987755982988]}
    expect:
      center: [640, 360]
      crop_w: 500
      crop_h: 666.666687
      matrix: [[0.332554, -0.192, -47.714403], [0.192, 0.332554, -114.599356]]
  - id: roi-negative-rotation-inverse
    note: "the top-left corner of the model input maps to the ROI corner c - (w / 2) * x_axis -
      (h / 2) * y_axis"
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [640, 360, 400, 200, -0.5235987755982988], model_xy: [0, 0]}
    expect: {source_xy: [256.826986, 196.32487]}
  - id: roi-rotation-aspect-ratio-not-kept
    note: "maintain_aspect_ratio false and rotation 1: P2 is half the crop height from the
      centre, against the ROI y axis (-sin r, cos r). The x and y scales of M differ"
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: false}
    input: {roi: [300, 200, 120, 300, 1]}
    expect:
      center: [300, 200]
      crop_w: 150
      crop_h: 375
      matrix: [[0.691587, 1.077083, -326.892659], [-0.574444, 0.368846, 226.563972]]
  - id: roi-rotation-aspect-ratio-not-kept-inverse
    note: "the bottom-right corner of the model input maps to c + (w / 2) * x_axis + (h / 2) *
      y_axis"
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: false}
    input: {roi: [300, 200, 120, 300, 1], model_xy: [192, 256]}
    expect: {source_xy: [182.746857, 364.417]}
  - id: roi-half-turn
    note: "rotation -pi, the lower limit of [-pi, pi). The crop is upside down: the ROI x axis
      is (-1, 0) and the ROI y axis is (0, -1), within float64 rounding"
    params: {target_size: [256, 192], expand_ratio: 1, maintain_aspect_ratio: true}
    input: {roi: [100, 100, 150, 200, -3.141592653589793]}
    expect:
      center: [100, 100]
      crop_w: 150
      crop_h: 200
      matrix: [[-1.28, 0, 224], [0, -1.28, 256]]
  - id: roi-half-turn-inverse
    note: "the top-left corner of the model input maps to the bottom-right corner of the ROI in
      the image, (175, 200)"
    function: inverse
    params: {target_size: [256, 192], expand_ratio: 1, maintain_aspect_ratio: true}
    input: {roi: [100, 100, 150, 200, -3.141592653589793], model_xy: [0, 0]}
    expect: {source_xy: [175, 200]}
  - id: roi-expand-along-roi-axes
    note: "a square ROI 50 x 50, turned by pi/4, in a square target. expand_ratio 1.2 grows the
      ROI along its own axes to 60.000004 x 60.000004 (f32(50 * f32(1.2))). An ROI that
      the pipeline already grew by 1.25 thus gives a crop 1.5 times the size of the points
      box"
    params: {target_size: [256, 256], expand_ratio: 1.2, maintain_aspect_ratio: true}
    input: {roi: [320, 240, 50, 50, 0.7853981633974483]}
    expect:
      center: [320, 240]
      crop_w: 60.000004
      crop_h: 60.000004
      matrix: [[3.016989, 3.016989, -1561.513803], [-3.016991, 3.016989, 369.359809]]
  - id: roi-rotation-not-finite
    note: "the rotation is NaN. The ROI is a host value, not a sidecar value, so no rule
      refuses it. The host refuses it"
    checks: [refused]
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [200, 250, 200, 400, .nan]}
    expect: {error: no-rule}
  - id: roi-empty-crop
    note: "w = h = 0 gives an empty crop after the aspect step. The ROI is a host value, not a
      sidecar value, so no rule refuses it. The host refuses it"
    checks: [refused]
    params: {target_size: [256, 192], expand_ratio: 1.25, maintain_aspect_ratio: true}
    input: {roi: [200, 250, 0, 0, 0]}
    expect: {error: no-rule}
  - id: affine-crop-needs-target-size
    note: "the size declares no input.resize.target_size. The sidecar shows only its input and
      sizes blocks. The case checks only the rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: affine_crop, interpolation: linear}
        sizes: {m: {input: {shape: [-1, 3, 256, 192]}}}
    expect: {failed: [V-pre.resize.affine_crop-3]}
  - id: affine-crop-has-no-pad-position
    note: "an affine_crop resize does not letterbox, so input.resize.pad_position is not
      allowed. The sidecar shows only its input and sizes blocks. The case checks only the
      rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: affine_crop, interpolation: linear, pad_position: center}
        sizes: {m: {input: {shape: [-1, 3, 256, 192], resize: {target_size: [256, 192]}}}}
    expect: {failed: [V-pre.resize.affine_crop-3]}
  - id: affine-crop-expand-ratio-is-positive
    note: "crop_policy.expand_ratio is -1.25. The value is a float, but it is not positive. The
      sidecar shows only its input and sizes blocks. The case checks only the rules of
      this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize: {method: affine_crop, interpolation: linear, crop_policy: {expand_ratio: -1.25}}
        sizes: {m: {input: {shape: [-1, 3, 256, 192], resize: {target_size: [256, 192]}}}}
    expect: {failed: [V-pre.resize.affine_crop-1]}
  - id: affine-crop-maintain-aspect-ratio-is-boolean
    note: "crop_policy.maintain_aspect_ratio is the quoted string \"yes\". A string is not a
      boolean. The sidecar shows only its input and sizes blocks. The case checks only the
      rules of this section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize:
            method: affine_crop
            interpolation: linear
            crop_policy: {maintain_aspect_ratio: "yes"}
        sizes: {m: {input: {shape: [-1, 3, 256, 192], resize: {target_size: [256, 192]}}}}
    expect: {failed: [V-pre.resize.affine_crop-1]}
  - id: top-down-needs-affine-crop
    note: "keypoint.estimator_type is top_down_single_person, but input.resize.method is
      letterbox. The selector of this section does not match this sidecar. Rule -2 applies
      to each sidecar with a top-down estimator_type. The letterbox resize declares
      pad_position and rounding, and it has no crop_policy. The size declares target_size.
      The keypoint block holds only estimator_type and geometry. The sidecar shows only
      its input, sizes and keypoint blocks. The case checks only the rules of this
      section."
    function: none
    params: {}
    input:
      sidecar:
        input:
          name: input
          dtype: {fp32: float32}
          resize:
            method: letterbox
            interpolation: linear
            pad_position: center
            rounding: half_even
        sizes: {m: {input: {shape: [-1, 3, 256, 192], resize: {target_size: [256, 192]}}}}
        keypoint: {estimator_type: top_down_single_person, geometry: "2d"}
    expect: {failed: [V-pre.resize.affine_crop-2]}
