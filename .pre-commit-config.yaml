# Run `uv run pre-commit install` once in each clone (decision 0030).
# It installs the pre-commit hooks, the commit-msg hook and the pre-push hook. Run it again after
# this file changes.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: private-data
        name: private data
        entry: uv run python tools/check_private_data.py
        language: system
        pass_filenames: false
      # Decision gtwq: an entry ID that a different file has on another branch or worktree.
      - id: decision-log-ids
        name: decision log IDs
        entry: uv run python tools/check_decision_log.py --collisions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Decision p3n3: AI attribution in a commit message. The hook warns. It does not stop the commit.
      - id: ai-attribution
        name: AI attribution
        entry: uv run python tools/check_ai_attribution.py
        language: system
        stages: [commit-msg]
        verbose: true
