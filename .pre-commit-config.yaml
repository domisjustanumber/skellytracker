# Run `uv run pre-commit install` once in each clone (decision 0030).
# It installs the pre-commit hooks and the pre-push hook. Run it again after this file changes.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: private-data
        name: private data
        entry: uv run python tools/check_private_data.py
        language: system
        pass_filenames: false
      # Decision gtwq: an entry ID that a different file has on another branch or worktree.
      - id: decision-log-ids
        name: decision log IDs
        entry: uv run python tools/check_decision_log.py --collisions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
