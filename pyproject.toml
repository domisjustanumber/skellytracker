# pyproject.toml
# originally based on - https://realpython.com/pypi-publish-python-package/

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellytracker"
readme = "README.md"
authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision",
]

dependencies = [
    "opencv-contrib-python==5.0.0.93",
    "pydantic==2.14.3",
    "numpy==2.4.6",
    "onnxruntime==1.31.1",
    "tqdm==4.70.1",
    "numpydantic==2.0.0",
    "requests==2.34.2",
    "beartype==0.23.1",
    "pyyaml==6.0.3",
    "polars==2.1.0",
    "scipy==1.18.1",
]
requires-python = "==3.13.18"

dynamic = ["version", "description"]

# Extras for package consumers: `pip install skellytracker[mediapipe]`
# Local dev installs each extra: `uv sync --all-extras`
[project.optional-dependencies]
mediapipe = ["mediapipe==1.2.2"]

# RTMPose + YOLOX detectors (vendored, see skellytracker/core/detectors) need
# the onnx package for graph surgery.
# onnx 1.23 writes IR version 14; onnxruntime 1.31 reads IR version 13 or lower.
onnx = ["onnx==1.22.0"]

# Dev-only tooling: `uv sync` (installed by default via default-groups)
[dependency-groups]
dev = [
    "black==26.10.1",
    "bumpver==2026.1132",
    "isort==9.0.2",
    "pip-tools==7.6.2",
    "poethepoet==0.49.0",
    "pre-commit==4.6.2",
    "pytest==9.2.0",
    "ruff==0.15.17",
]

[tool.uv]
package = true
default-groups = ["dev"]
# Intel Mac is not supported. A required environment fails the lock when a wheel is missing.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# opencv-python is excluded because this project uses opencv-contrib-python,
# which provides a superset of opencv-python; having both installed causes a
# file-collision error.
exclude-dependencies = ["opencv-python"]

[project.urls]
Homepage = "https://github.com/freemocap/skellytracker"

[tool.bumpver]
current_version = "v2024.09.1019"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellytracker/__init__.py" = ["{version}"]

[tool.ruff.lint]
extend-select = ["B", "S", "C4", "ISC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]

[project.scripts]
skellytracker = "skellytracker.__main__:cli_main"

[tool.uv.sources]
skellytracker-rust = { path = "skellytracker-rust" }

# =============================================================================
# Task runner (poethepoet)
# =============================================================================
# List all tasks:        uv run poe --help
#
#   uv run poe rebuild     Rebuild Rust engine (verbose cargo output)
#   uv run poe lint        Run all ruff lint rules
#   uv run poe lint-fix    Auto-fix all ruff lint violations
#   uv run poe test        Run pytest
#
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["skellytracker/tests", "tools/tests", "decisions/scripts/tests"]
markers = [
    "video: tests that run inference over real video frames (slow, requires test recording)",
]

[tool.poe.tasks]
rebuild   = { cmd = "uv sync -v --reinstall-package skellytracker-rust --reinstall-package skellytracker", help = "Rebuild Rust engine with full cargo output" }
lint      = { cmd = "ruff check skellytracker/", help = "Run all ruff lint rules" }
lint-fix  = { cmd = "ruff check --fix skellytracker/", help = "Auto-fix all ruff lint violations" }
test      = { cmd = "pytest", help = "Run full test suite" }
test-fast = { cmd = "pytest -m 'not video'", help = "Run tests excluding slow video tests" }
